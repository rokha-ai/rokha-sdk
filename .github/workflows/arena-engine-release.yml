# Publish @rokha_ai/arena-engine to npm.
# Trigger:    git tag arena-engine-v0.1.0 && git push origin arena-engine-v0.1.0
# The tag's version must equal packages/arena-engine/package.json "version".
name: arena-engine release

on:
  push:
    tags: ['arena-engine-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/arena-engine-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/arena-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag matches the manifest
        run: |
          tag="${GITHUB_REF#refs/tags/arena-engine-v}"
          ver="$(node -p "require('./package.json').version")"
          [ "$tag" = "$ver" ] || { echo "tag $tag != package.json $ver"; exit 1; }
      - name: Test
        run: npm test
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
