[project]
name = "rokha-sdk"
version = "1.0.0"
description = "Python SDK for Rokha, the Agent Runtime and Marketplace"
keywords = ["rokha", "agents", "mcp", "runtime", "marketplace"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rokha"]
