  /api/mark/check:
    get:
      tags: [signals]
      summary: "Mark Check (#MCP) — is this coin, account or link a punk? Query: ?q=<Solana CA | @handle | https link>"
      description: |
        One deep read on any mark. A Solana contract address (or a pump.fun / DexScreener /
        Solscan / Birdeye link naming one) gets its mint + freeze authority, holder concentration,
        the deepest DexScreener pair and the social-signal row. An X account gets the full X account
        audit. Any public https link gets a crawl of the site, its llms.txt, MCP tools, OpenAPI,
        repos and packages. Every mark carries a deterministic red-flag audit, a verdict
        (CLEAN | SUS | PUNK — a critical flag never reads CLEAN), a title, a roast line, receipts
        and a 24h call (HOLDS | FOLDS) that is scored once, 24 hours later. Marks are saved: a fresh
        one is served to everyone. Omit `q` for the board. Same builder as the MCP tool `mark_check`.
        A risk read on public data, not advice. Public; a daily ceiling applies.
      operationId: getMarkCheck
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 300 } }
      responses:
        '200':
          description: The mark (or an `error` line), its history and the board
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  protocol: { type: string, enum: [mark-check] }
                  query: { type: string }
                  kind: { type: string, enum: [coin, x, link] }
                  error: { type: string }
                  from_ledger: { type: boolean }
                  mark:
                    type: object
                    additionalProperties: true
                    properties:
                      mark_id: { type: integer }
                      kind: { type: string }
                      label: { type: string }
                      verdict: { type: string, enum: [CLEAN, SUS, PUNK] }
                      title: { type: string }
                      roast: { type: string }
                      receipts: { type: array, items: { type: string } }
                      call: { type: string, enum: [HOLDS, FOLDS], nullable: true }
                      audit: { type: object, additionalProperties: true }
                      facts: { type: object, additionalProperties: true }
                      outcome: { type: string, enum: [called_it, missed], nullable: true }
                      outcome_state: { type: string, enum: [held, folded], nullable: true }
                      marked_at: { type: string, format: date-time }
                      share_url: { type: string }
                  history: { type: array, items: { type: object, additionalProperties: true } }
                  scoreboard: { type: object, additionalProperties: true }
                  recent: { type: array, items: { type: object, additionalProperties: true } }
                  receipts_wall: { type: array, items: { type: object, additionalProperties: true } }

  /api/hunt:
    get:
      tags: [signals]
      summary: "Hunt — a deep dive on any link. Query: ?q=<link | @handle | domain | gh:owner/repo | npm:pkg | pypi:pkg | name | Solana contract address>"
      description: |
        One lead in, one report out. Rokha crawls the project behind the lead — the site and its
        llms.txt, a live MCP server's tools/list, OpenAPI, the GitHub repo and manifests, npm/PyPI
        packages, the X account, and whether the Rokha Market already lists it — runs a
        deterministic red-flag audit, and writes the report from what was fetched: WHAT IT IS ·
        WHO'S BEHIND IT · AGENT SURFACES · ON ROKHA · RED FLAGS · BOTTOM LINE. A project's claims
        are attributed to it; "not found" is said plainly. The same lead within 24h is served from
        cache (`cached: true`). Reads only — nothing is posted, signed, paid or filed. Same builder
        as the MCP tool `hunt_report` and the `hunt` rig. A Solana contract address — bare, or in a
        pump.fun, DexScreener or Solscan link — is a lead too: the token is audited by Solwatch, and
        Mark Check wraps the hunt. A read of public data, not advice.
        Public; a daily ceiling applies (`error: daily_ceiling`).
      operationId: getHunt
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 300 } }
      responses:
        '200':
          description: The hunt, or `ok:false` with an `error` code and the inputs it takes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok: { type: boolean }
                  error: { type: string, enum: [missing_q, too_long, no_lead, not_cached, daily_ceiling, nothing_answered] }
                  message: { type: string }
                  usage: { type: string }
                  target: { type: string }
                  report: { type: string, description: "Plain text, in the section order above" }
                  red_flags:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        severity: { type: string, enum: [critical, warning, note] }
                        title: { type: string }
                        evidence: { type: string }
                        source: { type: string }
                  checks_passed: { type: array, items: { type: object, properties: { check: { type: string }, source: { type: string } } } }
                  not_checked: { type: array, items: { type: object, properties: { check: { type: string }, why: { type: string } } } }
                  critical: { type: boolean }
                  sites: { type: array, items: { type: string } }
                  mcp_live: { type: boolean }
                  composed_by: { type: string, enum: [rokha, rules] }
                  id: { type: string, format: uuid, description: "The hunt's id — rokha.ai/hunt/<id> and the card use it" }
                  headline: { type: string, description: "One plain sentence naming what this is" }
                  read: { type: string, description: "One sentence: can they trust and use it, and what to verify first" }
                  share_url: { type: string, format: uri, description: "The public page for this hunt (unfurls on X with the card)" }
                  card_url: { type: string, format: uri, description: "The 1200×630 PNG share card" }
                  stage: { type: object, additionalProperties: true, description: "A rokha_app block — title, verdict, metrics, sections (prose + the flag/surface tables), a Hunt-another action" }
                  cached: { type: boolean }
                  generated_at: { type: string, format: date-time }
                  note: { type: string }

  /api/hunt/{id}:
