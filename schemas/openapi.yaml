        '402': { description: "`studio_required` — a free account; the refusal names both doors (the month, the 1M $ROKHA hold)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { description: "`unavailable` — try again shortly", content: { application/json: { schema: { $ref: '#/components/schemas/DeskError' } } } }

  /api/desk/crews/{id}:
    put:
      tags: [desk]
      summary: "Write your manual crew — a roster of wallets you suspect move together (MCP desk_crew_set)"
      description: >-
        Create or change YOUR manual crew. `id` is a slug of 2–32 characters of `a-z`, `0-9`
        and `-`; the server serves it as `m-<slug>` (pass either form). The members' fills then
        land as `crew_buy` / `crew_sell` events under that id, the token row and the momentum
        feed count them under `crews.*`, and a strategy can name the crew
        (`{f: "crews.ids", op: "in", v: ["m-<slug>"]}`). `mode` says how `wallets` meets the
        current roster: `replace` (default), `add` or `remove`; `active: false` parks the crew
        (no fills counted) without deleting it; a new crew is active unless told otherwise. A
        wallet is in one crew at a time — a manual crew first. Signed-in JWT only (an `rk_`
        key is refused); a rig step on our door writes as its runner. No money moves.
      operationId: deskCrewSet
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Your crew's slug (2–32 of a-z, 0-9, -), with or without the `m-` prefix" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeskCrewBody' }
      responses:
        '200':
          description: The crew as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeskManualCrew' }
        '400': { description: "`bad_crew_id` (not 2–32 of a-z, 0-9, -) · `bad_wallets` (not Solana addresses, or more than 200) · `bad_roster` (the roster would be empty — delete the crew instead; more than 200 wallets; a mode that is not replace · add · remove)", content: { application/json: { schema: { $ref: '#/components/schemas/DeskError' } } } }
        '401': { description: "`unauthorized` — sign in (Bearer JWT); an rk_ key cannot write a crew", content: { application/json: { schema: { $ref: '#/components/schemas/DeskError' } } } }
        '409': { description: "`crew_taken` — another owner holds that id", content: { application/json: { schema: { $ref: '#/components/schemas/DeskError' } } } }
    delete:
      tags: [desk]
      summary: "Remove your manual crew (MCP desk_crew_set {action: remove})"
      operationId: deskCrewRemove
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Your crew's slug, with or without the `m-` prefix" }
      responses:
        '200': { description: "`{id, removed: true}`", content: { application/json: { schema: { type: object, properties: { id: { type: string, example: m-alpha-squad }, removed: { type: boolean, const: true } } } } } }
        '400': { description: "`bad_crew_id` — not a manual crew id", content: { application/json: { schema: { $ref: '#/components/schemas/DeskError' } } } }
        '401': { description: "`unauthorized`", content: { application/json: { schema: { $ref: '#/components/schemas/DeskError' } } } }
        '404': { description: "`not_found` — no crew of yours by that id (a foreign id reads as missing)", content: { application/json: { schema: { $ref: '#/components/schemas/DeskError' } } } }
        '503': { description: "`unavailable` — try again shortly", content: { application/json: { schema: { $ref: '#/components/schemas/DeskError' } } } }
