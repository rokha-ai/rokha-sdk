      responses:
        '200': { description: The product, content: { application/json: { schema: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } } } } } }
        '404': { description: Not priced — the item is free }
    put:
      tags: [sales]
      summary: "Set or change the price on an item you own (MCP product_set)"
      operationId: productSet
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, ref, model, price_cents]
              properties:
                kind: { type: string, enum: [rig, skill, harness, agent] }
                ref: { type: string }
                model: { type: string, enum: [one_time, monthly, per_run] }
                price_cents: { type: integer, minimum: 100, maximum: 1000000 }
                runs_per_pack: { type: integer, minimum: 1, description: "per_run only — runs bought per purchase" }
                active: { type: boolean, default: true, description: "false takes it off sale (free again)" }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } } } } } }
        '403': { description: Not the item's owner }
