  /api/front:
    get:
      tags: [network]
      summary: "The market — every published thing and claimed page as a card, ranked by real use (MCP front_board)"
      description: |
        Public, no auth, cached 60 s per (sort, kind, limit). Every published
        rig, skill, Forge agent, claimed page and marketer gets a card the
        moment it exists. `top` = most used (uses all-time, then distinct
        users, then last active); `live` = the last used; `active` = the last
        used, then newest; `new` = the newest. A card never carries an
        owner wallet or a runner identity. An unknown `sort`/`kind` or a
        non-numeric `limit` answers 400; a numeric `limit` is clamped to 1–60.
      operationId: getFrontBoard
      parameters:
        - { name: sort, in: query, required: false, schema: { type: string, enum: [top, live, active, new], default: top }, description: "top = most used" }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [all, rig, skill, agent, page, marketer], default: all } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 60, default: 24 }, description: "Clamped to 1–60; a non-number is a 400" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FrontBoard' } } } }
        '400': { description: "Unknown `sort` / `kind` (with `allowed`), or a non-numeric `limit` (with `max`)", content: { application/json: { schema: { $ref: '#/components/schemas/FrontBoardRefusal' } } } }
        '503': { description: "The market could not be read — never a half market", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/market:
    get:
      tags: [network]
      summary: "The Market — everything you can run on Rokha: Rokha-native rigs, skills, MCP servers, agents, builders and marketers, then the whole open registry (MCP market_search)"
      description: |
        Public, no auth, cached 30 s per query. Without `q`, Rokha-native items
        come first in the front board's order (`/api/front`), then the synced
        open registry (top = proven, then installs, then stars; live sorts the
        registry like top; new = first seen). With `q`, everything is ranked by
        relevance — title match > tag > description, proven first within a
        tie, Rokha-native first within that. Paging is by an opaque, signed
        `cursor` (the previous page's `next_cursor`) bound to the query that
        made it; a tampered, foreign or out-of-range cursor answers 400. An
        unknown value for any closed param answers 400 with `allowed`; `q`
        over 80 characters answers 400 with `max`; a numeric `limit` is
        clamped to 1–48. `total` and `facets` are null when `q` is set.
        Draft rigs (`draft-*`, `media-update`) are never listed. An item never
        carries an owner wallet, an email or a runner identity.
      operationId: getMarket
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 }, description: "Search words, trimmed" }
        - { name: aisle, in: query, required: false, schema: { type: string, enum: [all, rig, skill, mcp, agent, builder, marketer], default: all } }
        - { name: dept, in: query, required: false, schema: { type: string, enum: [all, trading, social, media, research, dev, data, fun], default: all } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [all, rokha, registry], default: all } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [popular, top, live, new, hired, qualified], default: popular }, description: "popular = one order across Rokha and the open registry (installs, stars, uses on Rokha); top = most used on Rokha" }
        - { name: price, in: query, required: false, schema: { type: string, enum: [any, free, paid], default: any }, description: "paid = an active creator product" }
        - { name: proven, in: query, required: false, schema: { type: string, enum: ['1', '0', 'true', 'false'], default: '0' } }
        - { name: rerank, in: query, required: false, schema: { type: string, enum: ['on', 'off'], default: 'on' }, description: "With q, the head of the page is re-scored by an OpenVINO™ cross-encoder on Intel® Xeon® (the x-rokha-rerank response header names the node when it ran); off serves the plain text-match order — the comparison knob." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 1024 }, description: "The previous page's next_cursor" }
        - { name: hire, in: query, required: false, schema: { type: string, enum: ['1', '0', 'true', 'false'], default: '0' }, description: "1 = only capabilities an agent can be hired for (at least one agent proven and priced on it; each item's `hire` is set). Off (the default), hireable capabilities lead the default order. MCP market_search `hire: true`." }
        - { name: ids, in: query, required: false, schema: { type: string }, description: "Exactly these items, in this order: a comma-separated list of item `id`s from earlier results (at most 48, each at most 300 characters; duplicates dropped). Every other filter is ignored, `next_cursor` is null, `total` is the number found, `facets` is null; an id that names nothing is simply absent. More than 48 or an id over 300 characters answers 400. The Market view of a set of picks is https://rokha.ai/market?ids=<ids>. MCP market_search `ids: [..]`." }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MarketPage' } } } }
        '400': { description: "A bad param (with `allowed` or `max`) or a refused cursor", content: { application/json: { schema: { $ref: '#/components/schemas/MarketRefusal' } } } }
        '503': { description: "The market could not be read — never a half page", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/market/shelves:
    get:
      tags: [network]
      summary: "The Market's shelves — most used, running now, proven, new this week, one per department, builders, popular in the open registry"
      description: |
        Public, no auth, cached 60 s. In this order, each omitted when it has
        fewer than 3 items, each at most 12: most_used (ranked by uses) ·
        running · proven ·
        new_week · dept_<key> (Rokha items first, then the open registry) ·
        builders · registry_popular. `href` is the "see all" query.
      operationId: getMarketShelves
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MarketShelves' } } } }
        '503': { description: "The market could not be read", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/market/art/{id}:
    get:
      tags: [network]
      summary: "A seat MCP server's own logo (raster only — png, jpeg, webp, gif)"
      operationId: getMarketArt
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The image, content: { image/png: {}, image/jpeg: {}, image/webp: {}, image/gif: {} } }
        '404': { description: "No such listing, or its logo is not a servable raster" }
  /api/market/object/{kind}/{provider}/{external_id}:
    get:
      tags: [network]
      summary: "The Object Page — everything the Market knows about one listing: the row, the same tile item, its tools, the owner's page and the doors (Connect / Run it / Clone it / SKILL.md)"
      description: |
        Public, no auth, never cached. `kind` is derived server-side
        (`server`, a seat or page MCP tool, or a self-listing with
        `metadata.harness.endpoint` → mcp; a rig → rig; else skill): a
        page asked for under the wrong kind still answers 200 — read
        `canonical` and replace the URL. `external_id` may hold `/`
        (encode each segment). An optional bearer is the viewer: it lets
        an owner read their own private row;
        nothing else is trusted from the request. A private row, a blocked
        owner's row, an unknown row or a malformed id is a 404
        (`not_found`) — never a 500. `doors.connect` / `doors.run` are the
        Studio's `?connect=<provider>%2F<external_id>` /
        `?run=` doors; `doors.agent_door` is the MCP endpoint an agent
        pastes. The same `href` / `cta` shape rides every `/api/market`
        tile: the title opens `/market/<kind>/<provider>/<external_id>`
        (a Rokha rig with a sub-page keeps `/@handle/<slug>`, a seat or
        page MCP server keeps `/@handle`), Connect opens the Studio connect
        door, Run it the Studio run door, Clone it `/studio?adopt=`.
      operationId: getMarketObject
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [rig, skill, mcp] } }
        - { name: provider, in: path, required: true, schema: { type: string, maxLength: 64 }, description: "registry_listings.provider_id — rokha, glama, docker_mcp, mcp_official, smithery, skills_sh, …" }
        - { name: external_id, in: path, required: true, schema: { type: string, maxLength: 512 }, description: "The row's external_id, each segment URL-encoded" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MarketObject' } } } }
        '404': { description: "not_found — unknown, private, blocked or malformed", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { description: "The market could not be read — never a half object", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/front/stats:
    get:
      tags: [network]
      summary: "The market's headline numbers — published, uses (all time and 24 h), registered, calls, live now, builders"
      operationId: getFrontStats
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FrontStats' } } } }
        '503': { description: "The market could not be read", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/front/paid:
    get:
      tags: [network]
      summary: "USDC paid to Rokha builders, on-chain, all time — the landing's Paid to builders figure"
      description: |
        Public, no auth. One figure: USDC actually sent to users with a
        confirmed on-chain signature — past network rewards, referral
        commissions, creator sales and agent-hire and training shares.
        Nothing owed or pending is counted. `usd` is a decimal string;
        an unreadable ledger answers `usd: null`, never 0. Cached ~60 s.
      operationId: getFrontPaid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  usd: { type: [string, 'null'], example: "1843.75" }
                  payouts: { type: [integer, 'null'] }
                  asset: { type: string, example: USDC }
                  as_of: { type: string, format: date-time }
                  what: { type: string }
                  ledger: { type: string, example: /api/ledger }
  # ============================================================
  # The Lab (API: edge) — the agent world, live (rokha.ai/lab; /edge redirects)
  # ============================================================

  /api/live:
    get:
      tags: [edge]
      summary: "The live desk — what is running on Rokha right now, as counts over its own ledgers (MCP edge_live reads a digest of it)"
      description: |
        Public, no auth, no parameters: every caller gets the same cached
        body (`Cache-Control: public, max-age=15`, one refill at a time; a
        busy refill serves the last good body). Every figure is a COUNT over
        a ledger Rokha already writes — the uses and cards come from the same
        snapshot `/api/front/stats` serves, so the desk and the landing never
        disagree. Public things only (the market's own filter); times are
        rounded to the minute, and a thing used by fewer than 3 distinct
        users is bucketed to the hour (`coarse: true`). An unreadable count
        is `null`, never 0. No owner, wallet, run or mandate id ever rides
        the body; the one id that may is `events[].trace_id`, and only for a
        run of a PUBLIC rig started after it went public (it reads
        anonymously at `GET /api/traces/{id}`). Per-IP governed (429 above
        the burst). Not gated by the Lab switch.
      operationId: getLiveDesk
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string }, description: "`public, max-age=15`" }
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveDesk' } } }
        '429': { description: Over the per-IP burst }
        '503': { description: "The snapshot could not be read and no earlier body exists — `live_desk_unavailable`", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/edge/world:
    get:
      tags: [edge]
      summary: "Edge — the agent world outside Rokha: registries, new listings, MCP SDK adoption, who connects, the MCP funnel, the spec (MCP edge_read)"
      description: |
        The Studio (a signed-in account with the month or the 1M $ROKHA hold;
        401 `sign_in` / 402 `studio_required` otherwise), cached 120 s
        server-side (`Cache-Control: public, max-age=60`), per-IP governed. Three answer shapes:

        - **No `section`** — the whole snapshot: `{generated_at, cache_seconds,
          sections}` where `sections` has one key per section
          (`registries`, `network_stats`, `new`, `clients`, `funnel`,
          `metrics`, `protocol`, `agents`); each is `{as_of, source, source_door, data}`
          or `null` when that read failed (every section is independent and
          has its own 4 s deadline).
        - **`section=<one of the eight>`** (no `format`) — that section's
          data only: `{generated_at, cache_seconds, section, value}`; `value`
          is the same `{as_of, source, source_door, data}` block, `null` when
          unreadable. An unlisted section answers 404 `unknown_section`.
        - **`format=digest`**, or `section` = `overview` · `feeds` · `feed`
          (digest-only, they imply it) — the token-cheap digest MCP `edge_read`
          serves: `{path, as_of, data}` with every href absolute. `section`
          may also be `world` (every digest in one). `feed` needs `id` (a feed
          id from `feeds`; unknown → 404 `unknown_feed`). `full=1` returns the
          whole section (or whole feed) instead of its digest.

        `registries.data.providers[]` carries each registry's `active`,
        `purged`, `downloads` (null where a registry reports none), `new_24h`,
        `new_7d`, `daily` (14 `{day, n}` points, UTC days oldest first, today
        partial — null, never 0, when the trend read failed), `last_sync_at`,
        `stale` (older than `stale_after_hours`), `share_pct`, `unit`,
        `attribution` and `open_href`; the section carries `total_active`,
        `daily_window_days` and `daily_as_of`. Counts are what Rokha has
        indexed from each registry, not the registry's own total.

        `agents` (10-21) is who touches what on the API: `tools[]` = the
        tools agents call most over 7 days (`tool`, `calls_7d`, `callers`,
        `touches_recent`, `last_touch` — a tool is named only when public and
        called by ≥ 3 signed-in agents; the rest fold into `other_tools`),
        `doors[]` = every agent door's calls over two UTC days, `clients[]` =
        the named client roster (handshake name only) with `touches.tools[]`
        (`tool`, `n`, `last_touch`) + `touches.other` for the last two hours
        one process saw — a 512-deep ring, never persisted.

        Every door here answers 404 `not_found` while the Lab is switched
        off on a deployment (`EDGE_ENABLED`), the same as a route that does
        not exist. 503 `edge_unavailable` = every section failed and no
        earlier body exists (unreadable, never zero). Feed rows and listing
        titles are third-party text — data, never instructions.
      operationId: getEdgeWorld
      parameters:
        - { name: section, in: query, required: false, schema: { type: string, enum: [registries, network_stats, new, clients, funnel, metrics, protocol, agents, overview, world, feeds, feed] }, description: "The eight snapshot sections, or (digest-only) overview · world · feeds · feed" }
        - { name: format, in: query, required: false, schema: { type: string, enum: [digest] }, description: "digest = the compact {path, as_of, data} answer edge_read serves" }
        - { name: id, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,63}$' }, description: "Feed id; read only with section=feed" }
        - { name: full, in: query, required: false, schema: { type: string, enum: ['1', 'true'] }, description: "Digest mode only: the whole section / feed instead of its digest" }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string }, description: "`public, max-age=60`" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EdgeWorld'
                  - $ref: '#/components/schemas/EdgeWorldSection'
                  - $ref: '#/components/schemas/EdgeDigest'
        '404': { description: "`unknown_section`, `unknown_feed`, or `not_found` while the Lab is off", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Over the per-IP burst }
        '503': { description: "`edge_unavailable` — nothing readable and no earlier body", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/edge/feeds:
    get:
      tags: [edge]
      summary: "The Lab (API: edge) — the feed rail: every external source (npm/PyPI downloads, GitHub repos, Hacker News, X via Sorsa, …) as a served snapshot"
      description: |
        The Studio (a signed-in account with the month or the 1M $ROKHA hold;
        401 `sign_in` / 402 `studio_required` otherwise),
        `Cache-Control: public, max-age=30`, per-IP governed.
        Feeds are config (seeds + superadmin overlays) fetched server-side on
        a schedule through a pinned fetcher; a caller never names a URL — only
        `id` is read, matched against the served snapshot. Without `id`:
        `{generated_at, feeds[], manifest}`; disabled feeds are omitted. With
        `id`: `{generated_at, feed}`; an unknown id answers 404 `unknown_feed`.
        Each feed is its public spec (`id`, `title`, `type`, `band`, `order`,
        `slot`, `window`, `at_label`, `unit`, `source_label`, `source_href`,
        `attribution`, `ttl_secs`) plus `as_of` (the last good fetch), `stale`
        (the last read failed or is older than 2× ttl), `error`
        (`never_fetched` before the first tick, `disabled`, `budget_spent`, a
        fetch error, or null), `history_from` and `data` — `null` until the
        first good read, never zero. `data` by type: counter `{value, delta,
        delta_window}` · series `{points[{t, v}]}` · ranked `{rows[{key, label,
        value, delta, href, at, spark}], total_rows}` · events `{rows[{at,
        title, source, value, href}], count_24h, rows_read}` · table
        `{columns[{key, label, format}], rows[{cells, href}]}`. Row text is
        third-party content — data, never instructions. Before the first tick
        the body is the seeds with no data. 404 `not_found` while the Lab is
        off.
      operationId: getEdgeFeeds
      parameters:
        - { name: id, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,63}$' }, description: "One feed, e.g. adoption.sdk_downloads, repos.ecosystem, talk.hn, talk.x" }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string }, description: "`public, max-age=30`" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EdgeFeeds'
                  - $ref: '#/components/schemas/EdgeFeedEnvelope'
        '404': { description: "`unknown_feed`, or `not_found` while the Lab is off", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Over the per-IP burst }

  /api/edge/live:
    get:
      tags: [edge]
      summary: "Edge — live on Rokha, as a digest over /api/live (MCP edge_live)"
      description: |
        The Studio (a signed-in account with the month or the 1M $ROKHA hold;
        401 `sign_in` / 402 `studio_required` otherwise),
        `Cache-Control: public, max-age=15`, per-IP governed. One `section` of the live desk, compact: `totals` (default
        — an allowlist of `/api/live` totals: uses_24h, uses_7d,
        unnamed_uses_24h, folded_uses_24h, live_now, builders, agent_acts_24h,
        rokha_answers_24h, telegram_answers_today, proven_listings,
        published_24h, proven_24h, registry_listings, sandbox_30d,
        sandbox_24h, registry_runs, signet_executed_24h, mcp_calls_7d — money
        never rides this door) · `lanes` (one per nameable agent, Rokha
        first: key, name, in_house, status, counts_24h, unread, daily_only,
        last_at, page) · `events` (newest first; a public rig's run carries a
        `trace_id` readable at `GET /api/traces/{id}`) · `pulse` (24 hourly
        buckets, oldest first, with `null_kinds`) · `spokes` (the most-used
        public things and agents: id, title, kind, uses, href) · `signet`
        (`{executed_24h, active_permits, refused}` from `/api/signet/stats`) ·
        `field` (the whole agent world on one wire as rows — every registry,
        talk feed, repo and Rokha source on `/api/edge/field` with its 24 h
        total in its own unit, busiest first: `{sources_total, sources[{id,
        title, kind, href, sector, total_24h, unit, last_at, source, as_of}],
        totals, sectors, unreadable, window_hours, note}`; the dots and the
        hourly pulse stay on `GET /api/edge/field`).
        `limit` = rows for events/spokes/lanes/field, clamped 1–60 (a
        non-number is the default 10). Never the per-minute pulse or spoke dots. Answers
        `{path, as_of, data}` with absolute hrefs. An unlisted section is 404
        `unknown_section`; 503 `edge_unavailable` when the live desk cannot be
        read; 404 `not_found` while the Lab is off.
      operationId: getEdgeLive
      parameters:
        - { name: section, in: query, required: false, schema: { type: string, enum: [totals, lanes, events, pulse, spokes, signet, field], default: totals } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 60, default: 10 }, description: "Rows for events/spokes/lanes/field; clamped" }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string }, description: "`public, max-age=15`" }
          content: { application/json: { schema: { $ref: '#/components/schemas/EdgeDigest' } } }
        '404': { description: "`unknown_section`, or `not_found` while the Lab is off", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Over the per-IP burst }
        '503': { description: "`edge_unavailable` — the live desk could not be read", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/edge/field:
    get:
      tags: [edge]
      summary: "The Lab (API: edge) — the field: /api/live's shape with the world (new registry listings, posts, repo pushes) merged in front of Rokha's own activity"
      description: |
        The Studio (a signed-in account with the month or the 1M $ROKHA hold;
        401 `sign_in` / 402 `studio_required` otherwise), no parameters,
        `Cache-Control: public, max-age=15` (30 s server cache), per-IP
        governed. Exactly `/api/live`'s shape —
        `manifest`, `totals`, `pulse`, `spokes`, `events`, `lanes` — so a
        reader of the live desk reads this unchanged, with the world merged
        in: three more event kinds (`listed` = a public, active listing first
        seen by Rokha's sync in the last 24 h, at the registry's own creation
        minute when it falls in the window; `posted` = a post from the talk
        feeds on `/api/edge/feeds`; `pushed` = an ecosystem repo's last push)
        each a real timestamped thing from a source the Lab already reads —
        nothing spread, interpolated or invented. World spokes carry `unit`,
        `source_label` and `as_of`; world events carry a `detail` line and
        never a `trace_id`. `totals` adds `field_24h`, `world_24h`,
        `listed_24h`, `posted_24h`, `pushed_24h` (null when that source was
        unreadable), and `totals.prev_24h`: every `*_24h` total again over the
        day before (top-level `prev_window` {from, to} = 48 h → 24 h ago) and
        every `*_7d` total over the 7 days before — the same predicate, null
        when it cannot be counted the same way (agent acts, unnamed/folded
        splits, repo pushes, and the field/world sums built on them). `unreadable[]` names every source that could not be read
        this fill (`registries`, `talk`, `repos`, `rokha`) — its sector is
        absent, never zero. Rokha's own part follows `/api/live`'s rules
        verbatim (`lanes` is `/api/live`'s, null when it was unreadable).
        Per-day aggregates (SDK downloads) have no minute and stay off the
        field. 404 `not_found` while the Lab is off; 503 `edge_unavailable`
        when nothing was readable and no earlier body exists.
      operationId: getEdgeField
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string }, description: "`public, max-age=15`" }
          content: { application/json: { schema: { $ref: '#/components/schemas/EdgeField' } } }
        '404': { description: "`not_found` while the Lab is off", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Over the per-IP burst }
        '503': { description: "`edge_unavailable`", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/edge/hive:
    get:
      tags: [edge]
      summary: "The Lab (API: edge) — the hive: public rigs' runs and the Jev decisions inside them, plus where the agent world on Rokha is heading"
      description: |
        The Studio (a signed-in account with the month or the 1M $ROKHA hold;
        401 `sign_in` / 402 `studio_required` otherwise), no parameters,
        `Cache-Control: public, max-age=15` (30 s server cache,
        single-flight), per-IP governed. `events[]`
        (newest first, ≤ 40, `at` to the minute): `{kind: "run", at, status:
        ok|fail|partial|running, rig: {title, href}}` for a run of a PUBLIC
        rig (the anonymously readable rule: an active rig listing bound to
        the rig, live before the run started), and `{kind: "decision", at,
        rig, step, answers: [{question, type: noul|choice|score, label, p,
        score}]}` for each answered Jev Decision step in such a run. A run is
        named by its listing only — never the runner, a run or trace id, an
        input, the step state or output text. `trend`: `things[]` (≤ 8 public
        listings/agents on the board by uses: `{kind, title, href, uses_24h,
        uses_prev_24h}`), `uses_24h`, `uses_prev_24h`, `runs_24h {ok, fail,
        partial, running}`, `decisions_24h`, `decision_labels[] {question,
        type, label, n}`, `searches` (always null: no search log is kept).
        `sample {roots_read, oldest_read_at, complete_24h,
        decision_runs_unread}` says how far back the newest-100-runs read
        reaches. Unreadable parts are null and named in `unreadable[]`
        (`runs`, `ledger`), never 0. 404 `not_found` while the Lab is off.
      operationId: getEdgeHive
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '404': { description: "`not_found` while the Lab is off", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Over the per-IP burst }

  /api/edge/market:
    get:
      tags: [edge]
      summary: "The Lab (API: edge) — the Trader view: Windsock's top tokens by signal score and their rank moves (no prices, no links)"
      description: |
        The Studio (a signed-in account with the month or the 1M $ROKHA hold;
        401 `sign_in` / 402 `studio_required` otherwise), no parameters,
        `Cache-Control: public, max-age=15` (30 s server cache), per-IP
        governed. `tokens[]` (≤ 20): `{rank,
        mint, symbol, name, score, hot, risk, prev_rank, rank_change, new}` —
        `score` = Windsock's trend score (milli); `rank_change` = places moved
        since the board 15–30 minutes ago (null until a baseline exists;
        `rank_change_vs_secs_ago` says how old it is). Symbols and names are
        attacker-authored text: control/bidi stripped and capped (16 / 40).
        No price, volume, liquidity or link ever rides; $ROKHA and tokens
        whose symbol or name claims to be Rokha are never listed. Signal
        heat, not advice. 404 `not_found` while the Lab is off; 503
        `edge_unavailable` when Windsock is unreadable and no earlier body
        exists.
      operationId: getEdgeMarket
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '404': { description: "`not_found` while the Lab is off", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Over the per-IP burst }
        '503': { description: "`edge_unavailable`", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/edge/me:
    get:
      tags: [edge]
      summary: "The Lab (API: edge) — your cockpit: approvals waiting, your agents, desks (paper), runs, hires, sales, listings and allowance since a time"
      description: |
        JWT only (Bearer) and the Studio (the month or the 1M $ROKHA hold —
        402 `studio_required` on a free account); the owner is the verified
        token's scope, never a parameter. `?since=<unix seconds>` (default 24 h ago, clamped to at
        most 7 days back, floored to the minute; echoed as `since` +
        `seen_at`). `Cache-Control: private, no-store`; a 45 s per-owner
        cache. Sections, each null when unreadable (named in
        `unreadable[]`): `tap {pending, capped, items[≤5]{id, summary,
        action_type, created_at}}`, `agents {count, acts_since,
        thoughts_since, replies_since, signet_since, jobs_since, last_act_at,
        top[≤3]{handle, name, acts_since, replies_since, last_act_at}}`,
        `desk {paper: true, agents[]{handle, name, theses_open, hit_rate,
        paper_pnl_pct, narratives_live, last_scan_at}, theses_open, hit_rate,
        paper_pnl_pct, paper_exits, ledgers{count, open_positions,
        closed_since, realized_pnl_pct_since}, arms{total, by_status}}`,
        `runs {total_since, ok, fail, partial, running, truncated,
        last[≤8]{trace_id, run_id, rig_name, status, at, stage_url},
        schedules{enabled, next{rig_name, next_run_at}}}`, `hires
        {as_buyer_running, as_buyer_since, as_owner_running, as_owner_since,
        earned_cents_since}`, `sales {count_since, count_total,
        usd_cents_since}`, `listings {count, proven, runs_total, views_7d,
        runs_by_others_7d}`, `allowance {tier, plan: free|studio,
        runs_used_today, runs_cap_today, runs_left_today, resets_at}`.
        401 without a valid token; 429 `slow_down` on a rebuild within 3 s of
        the last one; 404 `not_found` while the Lab is off.
      operationId: getEdgeMe
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: since, in: query, required: false, schema: { type: integer }, description: "Unix seconds; clamped to the last 7 days" }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '401': { description: No valid Bearer token }
        '404': { description: "`not_found` while the Lab is off" }
        '429': { description: "`slow_down`" }

  /api/admin/edge/feeds/draft:
    post:
      tags: [edge]
      summary: "Plug any JSON API into Edge — one fetch, an inferred feed spec, its preview (superadmin only; MCP edge_feed_draft)"
      description: |
        Superadmin only: JWT + the admin allowlist, and the handler re-checks
        the superadmin role from the verified claims (never a header). Body
        `{url, title?, headers?}` — unknown keys are refused. `url` (≤ 512
        chars) must pass the feed URL policy (https, a public dotted host on
        port 443, no user:pass, no #fragment, never an IP literal or an
        internal name); `title` ≤ 80 chars (default the host); `headers` is
        header name → a literal (`Accept`, `X-GitHub-Api-Version`) or
        `{secret_ref, optional?}` (`Authorization`, `X-Api-Key`) — a
        credential VALUE in a header is refused. The door fetches the URL
        ONCE through the pinned fetcher on the shared admin preview budget
        (30 a day, with `/api/admin/edge/feeds/test`), reads only the
        response's SHAPE (key names, types, sizes — no sample value reaches
        the spec), infers `events` (a time + a title per item), `ranked` (a
        label + a number), `series` (time/number pairs), `counter` (one
        number) or `table` (up to 6 columns), validates the draft, and runs
        it over the same sample for a preview (rows/points capped at 20).
        Nothing is saved: hand `spec` (edited or not) to `POST
        /api/admin/edge/feeds {spec}` — saved with `enabled: false` until
        flipped — or MCP `edge_feed_save`. Audit-logged (feed id + type,
        never the URL or a secret). Not gated by the Lab switch.
      operationId: adminEdgeFeedDraft
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string, maxLength: 512, description: "The JSON door to read, https only" }
                title: { type: string, maxLength: 80, nullable: true, description: "The feed's title; default the host" }
                headers:
                  type: object
                  nullable: true
                  description: "Header name → literal (Accept, X-GitHub-Api-Version) or {secret_ref, optional?} (Authorization, X-Api-Key). Never a credential value."
                  additionalProperties:
                    oneOf:
                      - { type: string }
                      - { type: object, required: [secret_ref], additionalProperties: false, properties: { secret_ref: { type: string }, optional: { type: boolean, default: false } } }
      responses:
        '200': { description: The draft, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeFeedDraft' } } } }
        '400': { description: "`invalid_spec` (with `field`) — a bad url, title or header; or `nothing_fits` — the response has no shape a grid can be drawn from", content: { application/json: { schema: { $ref: '#/components/schemas/EdgeFeedRefusal' } } } }
        '401': { description: No JWT }
        '403': { description: "`superadmin_only`", content: { application/json: { schema: { $ref: '#/components/schemas/EdgeFeedRefusal' } } } }
        '422': { description: "The fetch was refused or failed (the fetcher's error code), or the drafted spec mapped nothing from the sample (with `paths`)", content: { application/json: { schema: { $ref: '#/components/schemas/EdgeFeedRefusal' } } } }
        '429': { description: "`budget_spent` — today's 30 preview fetches are spent", content: { application/json: { schema: { $ref: '#/components/schemas/EdgeFeedRefusal' } } } }

