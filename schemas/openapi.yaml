          application/json:
            schema:
              type: object
              required: [wallet]
              properties:
                wallet: { type: string, description: "A Solana address (base58)" }
      responses:
        '200': { description: The message to sign, content: { application/json: { schema: { type: object, properties: { wallet: { type: string }, message: { type: string } } } } } }
        '400': { description: Not a Solana wallet, or this account's own login wallet }
        '401': { description: Sign in first }
        '409': { description: That wallet is another account's login }
        '429': { description: One challenge at a time }
  /api/ladder/wallet-link/verify:
    post:
      tags: [wallets]
      summary: "Finish linking a wallet — the signature over the challenge"
      description: "Signed in. Verifies the signature over the outstanding challenge and stores the link; a fresh signature moves a link that belonged to another account. Fails closed on a missing, stale or mismatched challenge and on a bad signature. Refresh the session token afterwards so what the wallet holds counts right away."
      operationId: walletLinkVerify
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet, signature]
              properties:
                wallet: { type: string }
                signature: { type: string, description: "The 64-byte ed25519 signature — base58, or the bytes comma-joined" }
      responses:
        '200': { description: Linked, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, wallet: { type: string } } } } } }
        '400': { description: No, stale or mismatched challenge }
        '401': { description: Sign in first, or the signature does not verify }
        '409': { description: That wallet is another account's login }
  /api/ladder/wallet-link/remove:
    post:
      tags: [wallets]
