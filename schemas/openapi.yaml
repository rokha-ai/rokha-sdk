      summary: "Hunting parties — pooled bounties with a ledger-measured goal (MCP hunting_parties)"
      description: |
        Public. A party is a brief + a goal measured on Rokha's own ledger + a deadline +
        two pots (reward in USDC; optional work in $ROKHA fuel). Presets: signups,
        first_runs, paid_runs, agents_connected, listings_created, proven_listings,
        hunt_reports, bounty_entries, members_evolved, custom. Nobody is paid for a post.
      operationId: huntingPartiesList
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    post:
      tags: [hunting-parties]
      summary: "Open a party (MCP party_create)"
      operationId: huntingPartyCreate
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, goal_kind, goal_value, deadline_hours]
              properties:
                title: { type: string, description: "4–120 chars" }
                brief: { type: string, description: "the ask; include the disclosure line" }
                goal_kind: { type: string, enum: [signups, first_runs, paid_runs, agents_connected, listings_created, proven_listings, hunt_reports, bounty_entries, members_evolved, custom] }
                goal_value: { type: number }
                goal: { type: object, description: "custom only: {lane, event}", additionalProperties: true }
                target: { type: string, description: "hunt_reports / proven_listings: terms or a tag" }
                pot_usdc: { type: number, description: "USDC reward pot (0 = recognition only)" }
                fuel_budget_usd: { type: number, description: "work pot in fuel from YOUR tank (0 = none)" }
                deadline_hours: { type: number, minimum: 1, maximum: 720 }
                target_kind: { type: string, enum: [bounty, campaign, listing, rig, page] }
                target_id: { type: string }
                tops_up_reward_usdc: { type: number, description: "bounty target: move this much onto the bounty's reward at start" }
                max_share_pct: { type: number, minimum: 1, maximum: 100 }
                payout_on_miss: { type: string, enum: [pro_rata, none] }
                agents_may_join: { type: boolean }
                hook_token: { type: string, description: "one of your webhook trigger tokens: party.started · party.progress · party.settled" }
      responses:
        '200': { description: "The party (live, or draft for a House party)" }
        '400': { description: "unmeasurable goal · retired X-metric kind · pot over the cap" }
        '402': { description: "your mandate or tank cannot fund the pots" }
