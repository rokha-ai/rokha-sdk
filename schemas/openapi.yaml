  # ============================================================
  # Rokha Network — join either end of the flywheel (MCP twins in parentheses)
  # ============================================================
  /api/network/plans:
    get:
      tags: [network]
      summary: "The two doors to pay Rokha, and what is free (MCP network_plans)"
      description: |
        Public. Since 2026-10-06 joining the Rokha Network is **free** and the
        monthly Network plans are retired (`retired: true`). The only two ways
        to pay Rokha directly are the two Studio doors: the Studio monthly
        ($249/mo — the Studio plus more platform access) or the Studio
        license ($1,495 once — the Studio plus more marketplace tooling,
        forever; `POST /api/studio/checkout`). Everything else is usage:
        paid runs, creator sales, fuel, bounties, member-funded campaign
        deliverables.
      operationId: networkPlans
      responses:
        '200': { description: The doors, content: { application/json: { schema: { type: object, additionalProperties: true, properties: { retired: { type: boolean }, doors: { type: string }, plans: { type: array, items: { type: object, additionalProperties: true } } } } } } }
  /api/network/subscribe:
    post:
      tags: [network]
      summary: "RETIRED (410) — Network plans no longer exist; joining is free"
      description: |
        Answers **410 `network_plans_retired`** with the two doors (the Studio
        monthly, or the Studio license). Joining the Network costs nothing:
        claim a page (`page_claim`) and you are on the Network; publish
        something that runs for a distinct other and you enter **incubation**
        (`GET /api/board/incubation`).
      operationId: networkSubscribe
      security: [ { bearerAuth: [] } ]
      responses:
        '410': { description: Retired — the two doors are named in the body }
        '401': { description: Not signed in }
  /api/network/me:
    get:
      tags: [network]
      summary: "Your membership — rank, score arithmetic, plan, period end (MCP network_me)"
      operationId: networkMe
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: Membership, content: { application/json: { schema: { type: object, properties: { member: { type: object, additionalProperties: true }, rank: { type: integer }, score: { type: integer }, plan: { type: string }, period_end: { type: string, format: date-time }, studio: { type: boolean }, creator_earnings_live: { type: boolean } }, additionalProperties: true } } } }
        '401': { description: Not signed in }
  /api/network/me/report:
