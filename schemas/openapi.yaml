    post:
      tags: [network]
      summary: "Open a campaign anchored on an official post (superadmin; Member-funded creator campaigns are not offered)"
      operationId: amplifyCampaignCreate
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                official_post_id: { type: string }
                title: { type: string }
                kind: { type: string, enum: [amplify, pin_week], default: amplify, description: "pin_week = the House's Pin of the Week (superadmin only)" }
                budget_usdc: { type: number }
