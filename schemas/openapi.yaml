  /api/free-tier:
    get:
      tags: [meta]
      summary: "What anyone gets free — ten questions a day with Rokha, listing; no free runs (MCP free_tier_status)"
      description: |
        Public. What is free: ONE daily unit allowance for talking to Rokha
        (`units_total` — about ten questions a day, on rokha.ai and on X;
        `questions_per_day`, `questions_left_today`), and listing. There
        are no free runs or builds: `free_runs_per_day` is 0 and every run
        or build needs the Studio and the caller's own model keys.
        `free_doors` are what a claimed page may list free (2 MCP listings ·
        3 rigs · 1 agent · 3 skills); `doors` is the way in when you want
        to run or build: `studio_monthly_usd` (29.99 — card, USDC or
        $ROKHA) and the hold (1,000,000 $ROKHA, `GET /api/billing/hold`).
      operationId: getFreeTier
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  tier: {}
                  line: {}
                  units_total: { type: integer, description: "Today's allowance in fuel units — about ten questions with Rokha" }
                  units_per_day: { type: integer, description: "The daily allowance in units (ten questions' worth)" }
                  units_usd_equiv: { type: number }
                  question_units: { type: integer, description: "Units one question costs" }
                  free_runs_per_day: { type: integer, description: "0 — there are no free runs" }
                  free_runs_left: { type: integer, nullable: true }
                  ramp: { type: object, additionalProperties: true, properties: { streak_days: { type: integer }, multiplier: { type: number }, step: { type: number }, max: { type: number } } }
                  free_doors: { type: object, properties: { mcp_listings: { type: integer }, published_rigs: { type: integer }, agents: { type: integer } } }
                  doors: { type: object, properties: { studio_monthly_usd: { type: number, example: 29.99 }, studio_license_usd: { type: integer }, fuel: { type: string } } }
                  questions_per_day: {}
                  questions_left_today: {}
                  resets: {}
