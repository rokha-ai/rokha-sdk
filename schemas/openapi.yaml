          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/marketplace/skills.md:
    get:
      tags: [marketplace]
      summary: Browsable third-party skills catalog (markdown)
      operationId: marketplaceSkillsMd
      responses:
        '200':
          description: Markdown
          content:
            text/markdown:
              schema: { type: string }

  # ============================================================
  # Builder Pages — public profile pages (/@handle)
  # ============================================================

  /api/pages:
    get:
      tags: [pages]
      summary: Directory of claimed builder pages
      description: >-
        All CLAIMED public builder pages with aggregate stats (listings,
        runs, badge, leaderboard rank) plus each builder's linked X
        (`x_handle` / `x_verified` / `x_verified_type`). Public, no auth.
        Pages exist only once their owner claims a handle.
      operationId: pagesDirectory
      responses:
        '200':
          description: '{ pages: [...] }'
          content:
            application/json:
              schema: { type: object }

  /api/pages/leaderboard:
    get:
      tags: [pages]
      summary: Top Builders leaderboard
      description: >-
        The ranked Top Builders board (the landing surface): a weighted,
        log-damped adoption score per builder — all-time rig runs weigh
        heaviest, then other runs and shipped creations, plus last-7-day
        actions and page views. Raw score components ride along, as does
        each builder's linked X (`x_handle` / `x_verified` /
        `x_verified_type`). Public.
      operationId: pagesLeaderboard
      parameters:
        - { name: limit, in: query, schema: { type: integer }, description: '1-100, default 10' }
        - { name: offset, in: query, schema: { type: integer }, description: page offset into the ranked board }
      responses:
        '200':
          description: '{ leaders: [...], total, offset }'
          content:
            application/json:
              schema: { type: object }

  /api/pages/{handle}:
    get:
      tags: [pages]
      summary: A builder's public page
      description: >-
        What /@handle renders — profile, links, badge, public creations,
        30-day activity heartbeat, view counts, rig sub-pages. Carries the
        builder's linked X when they have one: `x_handle` (no `@`, empty
        when unlinked), `x_verified` (X's own paid check — a NARROWER
        signal than the page's own `verified` mark), `x_verified_type`
        (blue/business/government/''). `promoter` is the reach side of the
        page (PromoterSection — roster status, reach tier, pinned days,
        results brought; `on_roster: false` + `focus` for a page that is not
        a promoter). A genuine open counts a page view (human OR agent); pass
        `preview=1` for card/list hydration that must NOT count. Public, no auth.
      operationId: pageByHandle
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: preview, in: query, schema: { type: string }, description: '"1" = do not count a view' }
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/pages/{handle}/avatar:
    get:
      tags: [pages]
      summary: A builder's profile photo (image bytes)
      operationId: pageAvatar
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The image (content-type per upload) }
        '404': { description: No photo set }

  /api/pages/{handle}/rig/{slug}:
    get:
      tags: [pages]
      summary: A rig sub-page (/@handle/slug)
      description: >-
        One published rig presented under its owner's page — only for rigs
        whose owner opted in (`linked`). Carries the owner's linked X
        (`x_handle` / `x_verified` / `x_verified_type`). Public, no auth.
        Also carries what a run asks for: `inputs` (one entry per input port,
        `[{name, label, type, required, placeholder}]` — the names
        `POST /api/rigs/run` takes in `inputs`) and `secret_refs` (the key
        NAMES a runner must have saved, `[{alias, host?}]`, never a value),
        plus `listing_id`, `source_id` and `registry_ref`.
      operationId: pageRigSubpage
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The rig sub-page
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/pages/me:
    get:
      tags: [pages]
      summary: Your page (or a claim suggestion) (JWT)
      description: >-
        Your page as the verified identity sees it. Unclaimed →
        `{ claimed: false, suggested_handle }`. Also carries your badge
        collection — `badges` is every badge you've earned (seeker /
        builder / architect / influencer / …), `badge` the ACTIVE one shown
        on public surfaces (choose it via PUT /api/pages/me/badge).
        Carries your linked X too — `x_handle` (no `@`, empty when
        unlinked), `x_verified` (X's own paid check), `x_verified_type`
        (blue/business/government/''). Reading this also refreshes a stale
        link, so it is the cheapest way to keep an agent's view current.
      operationId: myPage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Your page state
          content:
            application/json:
              schema: { type: object }
    put:
      tags: [pages]
      summary: Claim or update your page (JWT)
      description: >-
        Claim your public /@handle (or update it — your existing handle
        edits in place, a new one renames). Owner is ALWAYS the verified
        bearer identity. handle — lowercase letters/numbers/-/_ , ≤32, no
        edge hyphen, reserved and derived-shape names refused; display_name
        ≤80; bio ≤600; glyph 1-2 chars; links — array of {label, url}.
      operationId: claimPage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string }
                display_name: { type: string }
                bio: { type: string }
                glyph: { type: string }
                links: { type: array, items: { type: object } }
                focus: { type: array, maxItems: 5, items: { type: string, maxLength: 30 }, description: "Your niche / topics (a promoter roster gate). Absent = keep stored." }
      responses:
        '200': { description: '{ ok, handle }' }
        '400': { description: Invalid handle / lengths, or handle reserved }
        '409': { description: Handle taken }

  /api/pages/me/agent:
    put:
      tags: [pages]
      summary: Toggle this account into a sub-agent persona (JWT)
      description: >-
        The account IS the agent (Agent Creation B0). With agent_mode true,
        your page + profile become a sub-agent PERSONA of Rokha: POST
        /api/agents/{your-handle}/chat answers AS that persona — its voice
        built from your display name, bio, and persona harnesses — not as
        Rokha. Requires a claimed page (the handle is the agent's name;
        already reserved-name guarded). agent_public true lists it in
        GET /api/agents/available and opens it to every logged-in caller
        (each runner pays for their OWN turns and can never write into the
        owner's memory); false keeps it owner-only. agent_config.locked
        true FORCES agent_config.model on every runner — a runner's own
        preference never overrides a locked config, and a runner whose
        tier can't run the locked model is refused loudly, never silently
        downgraded. The persona's TOOLKIT is your loadout: your
        agent-toolkit prefs, optionally narrowed by
        agent_config.tool_profiles; tools run with the caller's authority,
        and visitors always get read-only tools. GET /api/pages/me reads
        the fields back. The MCP twin is the agent_mode_set gateway tool.
      operationId: setAgentMode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_mode]
              properties:
                agent_mode:
                  type: boolean
                  description: true = this account is a sub-agent persona
                agent_public:
                  type: boolean
                  description: >-
                    true = anyone logged in can chat with it (and it lists in
                    GET /api/agents/available); false = owner-only
                agent_config:
                  type: object
                  description: >-
                    Persona knobs, validated fail-closed (unknown keys
                    dropped). Omit to keep what's stored.
                  properties:
                    greeting:
                      type: string
                      maxLength: 400
                      description: one-line voice/greeting direction folded into the persona
                    model:
                      type: string
                      description: claude-* model id — HONORED when locked is true
                    locked:
                      type: boolean
                      description: >-
                        FORCE this agent's config — every runner gets
                        agent_config.model (their own preference never
                        overrides it), and a tier that can't run it is
                        refused loudly, never silently downgraded
                    tool_profiles:
                      type: array
                      items: { type: string }
                      description: >-
                        the LOADOUT — up to 8 profile names narrowing which
                        tools the agent carries (unknown names resolve to
                        nothing — a typo narrows, never widens); empty = the
                        standard toolkit
      responses:
        '200': { description: '{ ok, handle, agent_mode, agent_public, chat_path }' }
        '400': { description: Invalid agent_config field }
        '412': { description: No claimed page — claim a handle first }

  /api/pages/me/payout-evm:
    put:
      tags: [Pages]
      summary: "Be paid on an EVM chain instead of Solana (MCP payout_wallet_set {evm_address, chain, token})"
      description: >-
        Sets where this account's sale shares, hire shares, trainer shares and affiliate credits are
        sent: a 0x wallet, on Base (USDC), Ethereum (USDC or USDT) or Robinhood Chain (USDG).
        `address: ""` goes back to Solana. The Solana payout address is never changed by this call.
        Changing the destination of an account that was already payable pauses sends for 10 minutes.
        Signed-in session only (never an rk_ key). Needs a claimed page.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, description: "A 0x wallet address, or \"\" to go back to Solana" }
                chain: { type: string, enum: [base, ethereum, robinhood], default: base }
                token: { type: string, enum: [USDC, USDT, USDG] }
                prefer: { type: string, enum: [evm, solana], default: evm }
      responses:
        '200':
          description: "Saved"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  handle: { type: string }
                  paid_on: { type: string, enum: [evm, solana] }
                  evm:
                    type: object
                    properties:
                      address: { type: string, nullable: true }
                      chain: { type: string, nullable: true }
                      token: { type: string, nullable: true }
        '400': { description: "not a payable EVM address · unknown chain · a token that chain does not take" }
        '412': { description: "claim a handle first" }
  /api/pages/me/badge:
    put:
      tags: [pages]
      summary: Choose your active badge (JWT)
      description: >-
        Badges are a collection — you earn several (seeker for everyone,
        builder once a rig of yours is run by another wallet, influencer
        the moment you link your X account, more over time) and choose which ONE fronts
        your identity on every public surface (page, directory,
        leaderboard, rig sub-pages). GET /api/pages/me lists what you've
        earned; setting an unearned badge is refused with that list.
      operationId: setActiveBadge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [badge]
              properties:
                badge: { type: string, description: one of your earned badges }
      responses:
        '200': { description: '{ ok, badge, badges }' }
        '400': { description: 'badge_not_earned — the response lists your earned badges' }

  /api/pages/me/rig/{slug}:
    put:
      tags: [pages]
      summary: Configure one of your rig sub-pages (JWT)
      description: >-
        Owner config for ONE published rig on your page — mode ('builder'
        detail view | 'app' app-output surface), featured (headline it in
        your SHOWCASE; single slot, featuring one un-features the rest),
        linked (mint the public /@handle/slug link — opt-in; rigs get no
        sub-page by default). Claim your page first.
      operationId: configRigSubpage
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [builder, app] }
                featured: { type: boolean }
                linked: { type: boolean }
      responses:
        '200': { description: '{ ok, slug, rig_pages }' }
        '400': { description: Bad slug/mode, nothing to set, or too many configs }
        '404': { description: Claim your page first }

