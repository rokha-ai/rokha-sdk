      summary: "Rokha campaigns a roster creator can opt into (MCP amplify_campaigns)"
      description: |
        Public. The **Amplify lane**: promoters earn points for what their
        reach BRINGS to Rokha during campaigns anchored on an official
        @rokha_agent post — never for a post's likes or views. Promoters are on
        the Network like builders: a claimed page that explains their brand,
        X verified on it, then the roster (X account ≥180 days old, ≥20
        original posts in 90 days, payout wallet, clean audit; followers are
        not a gate). Opt in, get a tracked link, post as yourself — nothing is
        paid for the post; outcomes the link brought (a sign-in that
        goes on to run something · first run · paid run · agent connected ·
        listing created · bounty entered) land in your Brought lane; the reach
        tier (T1 500–2,500 · T2 2,500–15,000 · T3 15,000+ median views per
        original post over 90 days) sets a roster marketer's weekly Brought cap.
        Pin of the Week is replaced (2026-10-11) by founder-run campaigns —
        see `GET /api/campaigns`. Nobody is paid for a post.
      operationId: amplifyCampaigns
