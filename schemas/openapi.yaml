  # ============================================================
  # MCP — Model Context Protocol
  # ============================================================

  /mcp/health:
    get:
      tags: [mcp]
      summary: MCP protocol service health
      operationId: mcpHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /mcp/tools:
    get:
      tags: [mcp]
      summary: List available MCP tools (convenience, non-JSON-RPC)
      operationId: mcpListToolsConvenience
      responses:
        '200':
          description: Tool list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MCPTool' }

  /mcp/jsonrpc:
    post:
      tags: [mcp]
      summary: MCP JSON-RPC endpoint (full protocol)
      description: |
        Implements MCP 2025-11-25. Common methods:
          - `initialize` — protocol negotiation
          - `tools/list` — enumerate tools
          - `tools/call` — invoke a tool with arguments

        PUBLIC (no auth): the discovery handshake — `initialize`,
        `notifications/initialized`, `ping`, `tools/list`, `resources/list`,
        `prompts/list` — plus `tools/call` on the public tools:
        `registry_search`, `registry_get_skill`, `skill_author`,
        `harness_author`, `auth_wallet_challenge`, `auth_wallet_verify`,
        `page_get`, `page_directory`, `page_leaderboard`, `justify_seeds`,
        `x_account_audit` (self-gated: JWT or `x-anon-session-id`),
        `adnet_feed`, `adnet_stats`, `adnet_rounds`, `network_report`,
        `carry_brief`, `studio_doors`, `flight_plan`, `seeds_explain`,
        `seeds_recent_posts`, `boosts_explain`, `audit_history`,
        `payouts_ledger`, `hunting_parties`, `free_tier_status`,
        `media_library`, `agents_directory`, `trace_get` and `trace_search`
        (a PUBLIC rig's run, by id), `agent_desk`, `signal_feed`,
        `network_plans`, `network_pot`, `network_members`, `product_get`,
        `network_briefs`, `fuel_boost_menu`, `campaigns`, `board_get`
        (the Network's Incubation board), `bounty_list`, `amplify_campaigns`,
        and every sponsor tool
        (`<brand>__<tool>`). An MCP 2026-07-28 `server/discover` probe answers
        JSON-RPC `-32601` so the client falls back to `initialize`.
        Every other method/tool requires `Authorization: Bearer <JWT>`.

        Notable tool families (enumerate live via `tools/list`): harness /
        rig / trace CRUD (the Working-Rig surface), `skill_author` — author a portable Agent Skill (SKILL.md) the same
        way the human Build-a-Skill builder does (two-front-door parity); and
        `harness_author` — configure a Harness (a skill/instruction wired to
        run) the same way the human Build-a-Harness builder does; and
        `registry_publish` (JWT) — publish (or update) YOUR listing as a
        searchable registry entry, handled at the gateway so ownership and
        the display author always come from the VERIFIED bearer identity
        (mirrors POST /api/marketplace/registry/publish; advertised in
        tools/list; anonymous calls are refused); and the rig SCHEDULE suite
        (JWT) — `schedule_create` (run a SAVED rig automatically on an
        `every-1-min` | `every-5-min` | `every-15-min` | `hourly` | `daily` |
        `weekly` cadence; pass the rig's UUID as
        `rig_id`; every fire is owner-scoped and draws on the owner's daily
        run budget — a spent budget skips the fire, recorded as
        `skipped_budget`; cap 20 schedules per account), `schedule_list`
        (cadence, enabled, next/last run, run count, last status —
        `ok` | `partial` (some steps failed) | `error` | `skipped_budget`),
        `schedule_delete`, and `schedule_pause` (`paused: true|false`) —
        the same schedules the UI's 🕐 Schedule panel and /api/schedules
        manage; the WEBHOOK-TRIGGER suite (JWT) — `hook_create` (bind a SAVED
        rig to a secret URL that outside systems POST to fire it, the payload
        becoming the rig's run input; rate-limited per hook; every fire is
        budget-gated), `hook_list`, `hook_delete` (revokes the URL), and
        `hook_pause`; the AUTH-LADDER suite — `auth_resolve` (classify how any
        MCP server authenticates: `open` | `key` (paste a token in the vault) |
        `tier1` (one-click account-wide OAuth Connect) | `oauth_spec` (the
        server speaks the MCP auth spec — Rokha connects via dynamic client
        registration; works without login), `auth_connections` (JWT — your
        connected services + their vault aliases), and `auth_connect` (JWT —
        start a Connect: pass a Tier-1 `provider` or any `server_url`; returns
        the browser consent URL, and on approval the token lands in your vault
        as `oauth-<provider>` / `mcp-<host>`, injectable via `secret_refs`); and
        `list_saved_keys` (JWT — list the caller's saved keys & secrets:
        provider + alias + a MASKED preview, NEVER a value, so an agent sees
        what is attachable by `secret_refs` without reading secret material);
        and the GATEWAY suite (JWT) — `gateway_register` (register an external
        MCP server behind your ONE Rokha gateway endpoint with credentials
        injected server-side; `secret_alias` names the vault key/grant that
        authenticates it) and `gateway_list` (your registered servers + the
        gateway URL an MCP client connects to — every server's tools appear
        namespaced `<slug>_<tool>`); the WALLET-AUTH suite (PUBLIC — this is
        how an agent with a wallet keypair becomes a logged-in user without a
        browser): `auth_wallet_challenge` (returns a message to sign; Solana
        base58/Ed25519 or EVM 0x/EIP-191 addresses) and `auth_wallet_verify`
        (submit the signature → auto-registers a new wallet, free tier, and
        returns the `session_token` JWT every gated tool needs — mirrors
        `/api/wallets/challenge` + `/api/wallets/verify`); and the BUILDER
        PAGES suite — public reads `page_directory` (claimed pages),
        `page_leaderboard` (the Top Builders board) and `page_get` (any
        /@handle page; counts a genuine view), plus JWT-gated `page_me`
        (your page, or `{claimed:false, suggested_handle}`), `page_claim`
        (claim/update your public /@handle — owner is always the verified
        bearer) and `page_rig_config` (mode / featured / linked for one of
        your published rigs' sub-pages) — mirrors `/api/pages/*`.

        RUNS AND TRACES: `trace_get` takes `id` (a trace UUID) or `run_id`
        (a run UUID — answered in the run door's shape: status, steps with
        their trace ids, output, traces); `trace_search` takes `run_id` plus
        optional `trace_kind`, `status`, `node_id`, `parent_trace_id`,
        `harness_id`, `rig_id`. Both are callable anonymously for a PUBLIC
        rig's run (runner identity stripped, `visibility: "public"`); signed
        in, you read your own traces in full plus any public run. Anything
        else answers not-found. `rig_run` takes `inputs` (`{name: value}` for
        a multi-input rig — the names on the rig's page payload) and
        `input_attachment` (signed-in only: the id of one of YOUR data
        attachments, fed to the run as fenced data; a `test_input`
        attachment marks the run as test data, never proven). PAPER TRADING
        (JWT): `signet_wallet_activity` (a Solana wallet's recent swaps) →
        `signet_paper_buy` / `signet_paper_sell` → `signet_paper_positions`
        (open, closed, P&L), and `signet_paper_reset` — real Jupiter quotes,
        a recorded ledger, no money moves (REST twin POST /api/signet/paper).
        PLEDGE POOLS (the Arena's rail): `signet_pledge_pool` (public read),
        `signet_pledge_pool_open` / `signet_pledge_pool_cancel` /
        `signet_pledge_pool_result` / `signet_pledge_outcomes` (organiser;
        opening limited to approved organisers), `signet_pledge` /
        `signet_pledge_confirm` / `signet_pledge_reference` /
        `signet_pledge_disclose` / `signet_pledge_withdraw` /
        `signet_pledges_mine` (pledger) — REST twins under /api/signet/pledge-pools
        and /api/signet/pledges.

        Scope is identity-derived, never client-supplied: for the wallet-scoped
        JWT tools (`rig_author`, `create_harness`/`list_harnesses`/`get_harness`/
        `update_harness`/`delete_harness`/`search_harnesses`, the `schedule_*`,
        `hook_*`, `auth_connect`/`auth_connections`, and `gateway_*` suites,
        and `get_allowances`) the gateway derives the owner from your
        verified token and overrides any `wallet_address` argument — so you
        never pass your scope, can't spoof another's, and a rig you author
        lands in the same scope the run endpoint reads from.
      operationId: mcpJsonRpc
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPJsonRpcRequest' }
      responses:
        '200':
          description: JSON-RPC response (success or error in envelope)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPJsonRpcResponse' }

  # ============================================================
  # Marketplace — Rokha Registry listings + Registry
  # ============================================================

  /api/marketplace/listings:
    get:
      tags: [marketplace]
      summary: Native Rokha Registry listings
      operationId: listMarketplaceListings
      responses:
        '200':
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketplaceListing' }

  /api/marketplace/listings/{id}:
    get:
      tags: [marketplace]
      summary: Get a single listing
      operationId: getMarketplaceListing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceListing' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/marketplace/search:
    post:
      tags: [marketplace]
      summary: Search listings
      operationId: searchMarketplace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceSearchRequest' }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketplaceListing' }

  /api/marketplace/featured:
    get:
      tags: [marketplace]
      summary: Featured listings
      operationId: featuredMarketplace
      responses:
        '200':
          description: Featured
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketplaceListing' }

  /api/marketplace/stats:
    get:
      tags: [marketplace]
      summary: Marketplace stats
      operationId: marketplaceStats
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/marketplace/registry:
    get:
      tags: [marketplace]
      summary: Third-party registry index (ClawHub, Smithery, etc.)
      operationId: getRegistry
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string }, description: 'Filter by source (clawhub, smithery, smithery_skills, ...)' }
        - { name: listing_type, in: query, schema: { type: string, enum: [skill, server, harness, rig, agent] } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [downloads, stars, recent] } }
        - { name: execution_class, in: query, schema: { type: string, enum: [prompt, scripted, mcp] }, description: 'Filter by classified execution class' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Paged registry index
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryListResponse' }

  /api/marketplace/registry/publish:
    post:
      tags: [marketplace]
      summary: Publish one of your creations as a registry listing (JWT)
      description: |
        Logged-in users publish a creation (an authored skill, a harness, or a
        rig) into the registry as a `provider='rokha'` listing — it surfaces in
        normal registry search immediately. Re-publishing the same `name`
        updates the listing; a name already published by another user is
        rejected (409). Payloads carrying secret material (keys/tokens) are
        rejected. The listing's public `author` is your display identity —
        never a wallet or internal id.
      operationId: publishRegistryListing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, listing_type, description]
              properties:
                name: { type: string, description: 'Listing slug (kebab-case, ≤64) — the external_id' }
                listing_type: { type: string, enum: [skill, harness, rig], description: 'skill = an authored SKILL.md; harness = a harness config; rig = a rig. (server is accepted as a legacy alias for a harness publish)' }
                description: { type: string, maxLength: 4000 }
                title: { type: string }
                tags: { type: array, items: { type: string }, maxItems: 12 }
                version: { type: string, default: 0.1.0 }
                homepage: { type: string }
                metadata: { type: object, description: 'The artifact rides here — e.g. {skill_md} / {harness: <config>} / {rig: <content>} (≤200KB)' }
      responses:
        '200': { description: Published — live in registry search }
        '400': { description: Invalid name/type/description, or secret material detected }
        '409': { description: Name already published by another user }

  /api/marketplace/registry/publish/{external_id}:
    delete:
      tags: [marketplace]
      summary: Unpublish one of your listings (JWT, owner-checked)
      operationId: unpublishRegistryListing
      security:
        - bearerAuth: []
      parameters:
        - { name: external_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Unpublished — removed from search }
        '404': { description: No live listing with that name under your account }

  /api/marketplace/registry/mine:
    get:
      tags: [marketplace]
      summary: Your live published listings (JWT)
      operationId: myRegistryListings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Your provider='rokha' listings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryListResponse' }

  /api/marketplace/registry/skill-md:
    get:
      tags: [marketplace]
      summary: Ingest a listing's real SKILL.md — fetched from its source registry, parsed and classified
      description: >-
        Returns the skill's actual SKILL.md (frontmatter + body) plus a derived
        tool definition: an execution classification (prompt = a model can run
        it faithfully; scripted/mcp = needs a runtime), the binaries it
        requires, and the scripts it references. Provider-scoped — only known
        source registries are fetched. Cached server-side.
      operationId: getSkillMd
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string, enum: [clawhub, rokha] } }
        - { name: slug, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Parsed + classified SKILL.md bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillMdBundle' }
        '400':
          description: Unsupported provider or unsafe slug
        '404':
          $ref: '#/components/responses/NotFound'

  /api/marketplace/registry/{provider}/{id}:
    get:
      tags: [marketplace]
      summary: Get one registry listing
      operationId: getRegistryListing
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryListing' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/marketplace/registry/stats:
    get:
      tags: [marketplace]
      summary: Per-provider listing counts
      operationId: registryStats
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/marketplace/skills.md:
    get:
      tags: [marketplace]
      summary: Browsable third-party skills catalog (markdown)
      operationId: marketplaceSkillsMd
      responses:
        '200':
          description: Markdown
          content:
            text/markdown:
              schema: { type: string }

  # ============================================================
  # Builder Pages — public profile pages (/@handle)
  # ============================================================

  /api/pages:
    get:
      tags: [pages]
      summary: Directory of claimed builder pages
      description: >-
        All CLAIMED public builder pages with aggregate stats (listings,
        runs, badge, leaderboard rank) plus each builder's linked X
        (`x_handle` / `x_verified` / `x_verified_type`). Public, no auth.
        Pages exist only once their owner claims a handle.
      operationId: pagesDirectory
      responses:
        '200':
          description: '{ pages: [...] }'
          content:
            application/json:
              schema: { type: object }

  /api/pages/leaderboard:
    get:
      tags: [pages]
      summary: Top Builders leaderboard
      description: >-
        The ranked Top Builders board (the landing surface): a weighted,
        log-damped adoption score per builder — all-time rig runs weigh
        heaviest, then other runs and shipped creations, plus last-7-day
        actions and page views. Raw score components ride along, as does
        each builder's linked X (`x_handle` / `x_verified` /
        `x_verified_type`). Public.
      operationId: pagesLeaderboard
      parameters:
        - { name: limit, in: query, schema: { type: integer }, description: '1-100, default 10' }
        - { name: offset, in: query, schema: { type: integer }, description: page offset into the ranked board }
      responses:
        '200':
          description: '{ leaders: [...], total, offset }'
          content:
            application/json:
              schema: { type: object }

  /api/pages/{handle}:
    get:
      tags: [pages]
      summary: A builder's public page
      description: >-
        What /@handle renders — profile, links, badge, public creations,
        30-day activity heartbeat, view counts, rig sub-pages. Carries the
        builder's linked X when they have one: `x_handle` (no `@`, empty
        when unlinked), `x_verified` (X's own paid check — a NARROWER
        signal than the page's own `verified` mark), `x_verified_type`
        (blue/business/government/''). `promoter` is the reach side of the
        page (PromoterSection — roster status, reach tier, pinned days,
        results brought; `on_roster: false` + `focus` for a page that is not
        a promoter). A genuine open counts a page view (human OR agent); pass
        `preview=1` for card/list hydration that must NOT count. Public, no auth.
      operationId: pageByHandle
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: preview, in: query, schema: { type: string }, description: '"1" = do not count a view' }
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/pages/{handle}/avatar:
    get:
      tags: [pages]
      summary: A builder's profile photo (image bytes)
      operationId: pageAvatar
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The image (content-type per upload) }
        '404': { description: No photo set }

  /api/pages/{handle}/rig/{slug}:
    get:
      tags: [pages]
      summary: A rig sub-page (/@handle/slug)
      description: >-
        One published rig presented under its owner's page — only for rigs
        whose owner opted in (`linked`). Carries the owner's linked X
        (`x_handle` / `x_verified` / `x_verified_type`). Public, no auth.
        Also carries what a run asks for: `inputs` (one entry per input port,
        `[{name, label, type, required, placeholder}]` — the names
        `POST /api/rigs/run` takes in `inputs`) and `secret_refs` (the key
        NAMES a runner must have saved, `[{alias, host?}]`, never a value),
        plus `listing_id`, `source_id` and `registry_ref`.
      operationId: pageRigSubpage
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The rig sub-page
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/pages/me:
    get:
      tags: [pages]
      summary: Your page (or a claim suggestion) (JWT)
      description: >-
        Your page as the verified identity sees it. Unclaimed →
        `{ claimed: false, suggested_handle }`. Also carries your badge
        collection — `badges` is every badge you've earned (seeker /
        builder / architect / influencer / …), `badge` the ACTIVE one shown
        on public surfaces (choose it via PUT /api/pages/me/badge).
        Carries your linked X too — `x_handle` (no `@`, empty when
        unlinked), `x_verified` (X's own paid check), `x_verified_type`
        (blue/business/government/''). Reading this also refreshes a stale
        link, so it is the cheapest way to keep an agent's view current.
      operationId: myPage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Your page state
          content:
            application/json:
              schema: { type: object }
    put:
      tags: [pages]
      summary: Claim or update your page (JWT)
      description: >-
        Claim your public /@handle (or update it — your existing handle
        edits in place, a new one renames). Owner is ALWAYS the verified
        bearer identity. handle — lowercase letters/numbers/-/_ , ≤32, no
        edge hyphen, reserved and derived-shape names refused; display_name
        ≤80; bio ≤600; glyph 1-2 chars; links — array of {label, url}.
      operationId: claimPage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string }
                display_name: { type: string }
                bio: { type: string }
                glyph: { type: string }
                links: { type: array, items: { type: object } }
                focus: { type: array, maxItems: 5, items: { type: string, maxLength: 30 }, description: "Your niche / topics (a promoter roster gate). Absent = keep stored." }
      responses:
        '200': { description: '{ ok, handle }' }
        '400': { description: Invalid handle / lengths, or handle reserved }
        '409': { description: Handle taken }

  /api/pages/me/agent:
    put:
      tags: [pages]
      summary: Toggle this account into a sub-agent persona (JWT)
      description: >-
        The account IS the agent (Agent Creation B0). With agent_mode true,
        your page + profile become a sub-agent PERSONA of Rokha: POST
        /api/agents/{your-handle}/chat answers AS that persona — its voice
        built from your display name, bio, and persona harnesses — not as
        Rokha. Requires a claimed page (the handle is the agent's name;
        already reserved-name guarded). agent_public true lists it in
        GET /api/agents/available and opens it to every logged-in caller
        (each runner pays for their OWN turns and can never write into the
        owner's memory); false keeps it owner-only. agent_config.locked
        true FORCES agent_config.model on every runner — a runner's own
        preference never overrides a locked config, and a runner whose
        tier can't run the locked model is refused loudly, never silently
        downgraded. The persona's TOOLKIT is your loadout: your
        agent-toolkit prefs, optionally narrowed by
        agent_config.tool_profiles; tools run with the caller's authority,
        and visitors always get read-only tools. GET /api/pages/me reads
        the fields back. The MCP twin is the agent_mode_set gateway tool.
      operationId: setAgentMode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_mode]
              properties:
                agent_mode:
                  type: boolean
                  description: true = this account is a sub-agent persona
                agent_public:
                  type: boolean
                  description: >-
                    true = anyone logged in can chat with it (and it lists in
                    GET /api/agents/available); false = owner-only
                agent_config:
                  type: object
                  description: >-
                    Persona knobs, validated fail-closed (unknown keys
                    dropped). Omit to keep what's stored.
                  properties:
                    greeting:
                      type: string
                      maxLength: 400
                      description: one-line voice/greeting direction folded into the persona
                    model:
                      type: string
                      description: claude-* model id — HONORED when locked is true
                    locked:
                      type: boolean
                      description: >-
                        FORCE this agent's config — every runner gets
                        agent_config.model (their own preference never
                        overrides it), and a tier that can't run it is
                        refused loudly, never silently downgraded
                    tool_profiles:
                      type: array
                      items: { type: string }
                      description: >-
                        the LOADOUT — up to 8 profile names narrowing which
                        tools the agent carries (unknown names resolve to
                        nothing — a typo narrows, never widens); empty = the
                        standard toolkit
      responses:
        '200': { description: '{ ok, handle, agent_mode, agent_public, chat_path }' }
        '400': { description: Invalid agent_config field }
        '412': { description: No claimed page — claim a handle first }

  /api/pages/me/badge:
    put:
      tags: [pages]
      summary: Choose your active badge (JWT)
      description: >-
        Badges are a collection — you earn several (seeker for everyone,
        builder once a rig of yours is run by another wallet, influencer
        the moment you link your X account, more over time) and choose which ONE fronts
        your identity on every public surface (page, directory,
        leaderboard, rig sub-pages). GET /api/pages/me lists what you've
        earned; setting an unearned badge is refused with that list.
      operationId: setActiveBadge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [badge]
              properties:
                badge: { type: string, description: one of your earned badges }
      responses:
        '200': { description: '{ ok, badge, badges }' }
        '400': { description: 'badge_not_earned — the response lists your earned badges' }

  /api/pages/me/rig/{slug}:
    put:
      tags: [pages]
      summary: Configure one of your rig sub-pages (JWT)
      description: >-
        Owner config for ONE published rig on your page — mode ('builder'
        detail view | 'app' app-output surface), featured (headline it in
        your SHOWCASE; single slot, featuring one un-features the rest),
        linked (mint the public /@handle/slug link — opt-in; rigs get no
        sub-page by default). Claim your page first.
      operationId: configRigSubpage
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [builder, app] }
                featured: { type: boolean }
                linked: { type: boolean }
      responses:
        '200': { description: '{ ok, slug, rig_pages }' }
        '400': { description: Bad slug/mode, nothing to set, or too many configs }
        '404': { description: Claim your page first }

  # ============================================================
  # Discovery
  # ============================================================

  /api/discovery/tools:
    get:
      tags: [discovery]
      summary: Live MCP tool inventory
      operationId: discoverTools
      responses:
        '200':
          description: Tools currently available
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/discovery/agents:
    get:
      tags: [discovery]
      summary: Running agents
      operationId: discoverAgents
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/discovery/protocols:
    get:
      tags: [discovery]
      summary: Active protocols (MCP, A2A, etc.)
      operationId: discoverProtocols
      responses:
        '200':
          description: Protocols
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/discovery/all:
    get:
      tags: [discovery]
      summary: All of the above in one call
      operationId: discoverAll
      responses:
        '200':
          description: Aggregate
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/discovery/hot:
    get:
      tags: [discovery]
      summary: Hot/trending items (downloads + recent activity)
      operationId: discoverHot
      responses:
        '200':
          description: Hot list
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  # ============================================================
  # Analytics — privacy-safe capture (added 4.5.0)
  # ============================================================

  /api/analytics/session/start:
    post:
      tags: [analytics]
      summary: Begin (or refresh) an analytics session
      description: |
        Registers a browser session keyed by the client-minted anon session
        UUID (the same id the chat uses). Attribution is UUIDs only — never
        wallet addresses, tokens, or raw IPs. Idempotent per session id.
      operationId: analyticsSessionStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
                referrer: { type: string, maxLength: 300 }
                utm: { type: object, additionalProperties: { type: string } }
      responses:
        '204': { description: Recorded }

  /api/analytics/session/end:
    post:
      tags: [analytics]
      summary: Mark an analytics session's last activity
      operationId: analyticsSessionEnd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        '204': { description: Recorded }

  /api/analytics/events:
    post:
      tags: [analytics]
      summary: Ingest a batch of navigation/interaction events
      description: |
        Batched capture (max 50 events). Categories: `navigation`,
        `interaction`. Bounded payloads; events never carry PII.
      operationId: analyticsIngestEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, events]
              properties:
                session_id: { type: string, format: uuid }
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [category, action]
                    properties:
                      category: { type: string, enum: [navigation, interaction] }
                      action: { type: string, maxLength: 64 }
                      surface: { type: string, maxLength: 128 }
                      metadata: { type: object }
      responses:
        '204': { description: Recorded }
        '400': { description: Invalid batch (size/category/length) }

  /api/discovery/recent:
    get:
      tags: [discovery]
      summary: Recent registry activity (cross-registry events, newest first)
      description: |
        JSON read of the registry activity pulse — listings synced/updated across
        connected registries, with provider, action, and counts. The
        agent-consumable mirror of the SSE pulse stream. No auth.
      operationId: discoverRecent
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Recent events
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/marketplace/mcp-proxy:
    post:
      tags: [mcp]
      summary: Stateless one-shot outbound MCP probe/call
      description: |
        Probe or invoke an arbitrary MCP endpoint without provisioning a
        persisted connection. Hard-guarded — method allowlist
        (`tools/list` | `tools/call`), SSRF protection (https only in prod,
        private/metadata IPs blocked), 15s timeout, 256KB response cap.
        `tools/list` is public; `tools/call` requires a bearer JWT.
      operationId: mcpProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, method]
              properties:
                endpoint: { type: string, description: "Target MCP JSON-RPC endpoint URL" }
                method: { type: string, enum: ["tools/list", "tools/call"] }
                params:
                  type: object
                  additionalProperties: true
                  description: "For tools/call: { name, arguments }"
      responses:
        '200':
          description: "Flattened result: { ok, method, endpoint, tools? | result? }"
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: "tools/call without a valid token" }
        '400': { description: "Disallowed method or invalid/blocked endpoint" }

  # ============================================================
  # Rigs + Traces — the Working Rig surface
  # A Rig is a workflow of configured harnesses; a trace is the
  # record of a run (input in, result out). Authed surface is
  # owner-scoped via bearer JWT. The SAME surface is mirrored for
  # pre-login visitors under /api/anon/{rigs,harnesses,traces},
  # keyed by an `x-anon-session-id` header instead of a JWT.
  # ============================================================

  /api/rigs:
    get:
      tags: [rigs]
      summary: List the caller's rigs
      operationId: listRigs
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rigs
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [rigs]
      summary: Create a rig
      operationId: createRig
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string }
                summary: { type: string }
                content: { type: object, additionalProperties: true }
      responses:
        '200': { description: Created rig }

  /api/rigs/publish:
    post:
      tags: [rigs]
      summary: Publish a rig to the registry (the Studio's Publish button)
      description: >-
        Converts a saved rig (`rig_id`) or raw rig `content` into a registry
        `rig` listing — the same converter the MCP `rig_publish` tool uses.
        The publisher is the verified Bearer token, never a body field; a
        `rig_id` must be a rig in YOUR library (anything else is
        `rig_not_found`). Every step field travels, or a `notes[]` line says
        exactly what did not (a credential-shaped header, a key alias that
        does not name its host). Publishing an existing slug you own updates
        it. Only a publish from a saved rig can earn the proven stamp, and the
        stamp is bound to `content_sha256`: editing the rig un-proves it until
        its next clean run. Registry listings are public; any other
        `visibility` value is ignored with a note.
      operationId: publishRig
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send `rig_id` or `content`.
              properties:
                rig_id: { type: string, format: uuid, description: "A saved rig in your library" }
                content: { type: object, additionalProperties: true, description: "Raw rig content (the canvas graph or a steps[] list), at most 400 KB. Never earns the proven stamp." }
                title: { type: string, maxLength: 140 }
                description: { type: string, maxLength: 4000 }
                visibility: { type: string, description: "Only `public` is a listing option today" }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  listing_id: { type: [string, 'null'] }
                  slug: { type: string, description: "The registry slug — what POST /api/rigs/run takes as `rig`" }
                  url: { type: [string, 'null'] }
                  version: { type: string }
                  proven: { type: boolean }
                  notes: { type: array, items: { type: string }, description: "Everything that did not travel, and why" }
                  content_sha256: { type: string, description: "Fingerprint of the published content (layout positions and key order ignored)" }
                  source_id: { type: [string, 'null'], description: "The saved rig it was published from (null for a content publish)" }
                  inputs: { type: array, items: { $ref: '#/components/schemas/RigInputPort' } }
                  secret_refs: { type: array, items: { $ref: '#/components/schemas/RigSecretRef' } }
        '400': { $ref: '#/components/responses/RigDoorError' }
        '401': { $ref: '#/components/responses/RigDoorError' }
        '404': { $ref: '#/components/responses/RigDoorError' }
        '413': { $ref: '#/components/responses/RigDoorError' }
        '502': { $ref: '#/components/responses/RigDoorError' }

  /api/rigs/run:
    post:
      tags: [rigs]
      summary: Run a published rig in one call
      description: >-
        Starts a run of a published rig and answers at once with a run id and
        a poll block. No account needed: an anonymous caller runs under an
        `x-anon-session-id` (a UUID; one is minted and returned when absent —
        send it back when polling). With `Authorization: Bearer <token>` the
        run is billed to that account. Anonymous runs are capped per session
        and per IP (429). The run finishes whether or not the caller stays.


        Inputs are checked against the rig's published contract BEFORE
        anything runs (the rig's `inputs[]` on its page payload, or
        `inputs` on the publish answer): `inputs` names them, and the legacy
        `input` string still fills the FIRST declared input. A rig that
        declares no inputs takes only `input`. If the rig needs keys the
        runner has not saved (its `secret_refs`), the answer is 409
        `needs_secret` naming each one — anonymous callers have no key vault,
        so every key is missing for them. A key is only ever sent to the host
        it was declared for.
      operationId: runPublishedRig
      parameters:
        - { name: x-anon-session-id, in: header, required: false, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rig]
              properties:
                rig: { type: string, description: "The published rig's registry slug" }
                bounty_attempt: { type: string, format: uuid, description: "A Playground attempt id from POST /api/bounties/{id}/attempts (MCP bounty_attempt): the run is the entrant's attempt and, on a `tank` bounty, its fuel is drawn from the hirer's work budget" }
                input: { type: string, maxLength: 8000, description: "Legacy single input — the rig's {{input}}; fills the first declared input when `inputs` does not name it" }
                inputs:
                  type: object
                  maxProperties: 12
                  additionalProperties: true
                  description: >-
                    Named inputs `{name: value}` — each fills `{{input.<name>}}`
                    (the first also fills `{{input}}`). Types: `text` and `url`
                    up to 8,000 bytes (`url` must be http(s)), `number` must
                    parse as a finite number, `json` must be valid JSON (up to
                    32,000 bytes); 64,000 bytes across all inputs.
                provider_id: { type: string, default: rokha }
      responses:
        '202':
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string, enum: [running] }
                  run_id: { type: string, format: uuid }
                  rig: { type: string }
                  rig_id: { type: string, format: uuid }
                  anon_session_id: { type: [string, 'null'], format: uuid }
                  poll:
                    type: object
                    properties:
                      method: { type: string }
                      url: { type: string }
                      headers: { type: object, additionalProperties: { type: string } }
                  next: { type: string }
        '400':
          description: "`bad_rig` · `missing_input` · `unknown_input` · `bad_input` · `input_too_large` · `too_many_inputs`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RigDoorError' }
        '401':
          description: "`token_rejected` — the Bearer token is expired or revoked"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RigDoorError' }
        '402':
          description: >-
            `purchase_required` — the rig is paid and the caller has not bought it. The body
            names the product, its `checkout_url`, and carries an x402 challenge (`x402Version`,
            `accepts`: Solana `exact` USDC to the House wallet, the exact amount binding the
            payment to this caller's order). Pay, then retry the same request with header
            `X-PAYMENT: base64({"x402Version":1,"scheme":"exact","network":"solana","payload":{"signature":"<tx>"}})`
            — it is verified on-chain and the run starts in the same call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequired' }
        '404': { description: No published rig by that slug }
        '409':
          description: "`needs_secret` — the runner has not saved every key this rig needs"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  error: { type: string, const: needs_secret }
                  message: { type: string }
                  missing:
                    type: array
                    items:
                      type: object
                      properties:
                        alias: { type: string }
                        host: { type: string, description: "The one host this key is sent to (author-declared keys)" }
                        hint: { type: string, description: "Where to add it — Profile → Keys" }
                      required: [alias, hint]
        '429': { description: Anonymous daily run cap reached }
        '503':
          description: "`secret_check_unavailable` — saved keys could not be checked; try again"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RigDoorError' }

  /api/rigs/runs/{run_id}:
    get:
      tags: [rigs]
      summary: A run's status, steps, output and traces
      description: >-
        Poll until `done` is true (every few seconds). Right after the POST the
        status reads `starting`; a rig with a sandbox step can take about a
        minute on its first run while the sandbox starts.


        Who reads what: the runner (the same Bearer token, or the same
        `x-anon-session-id` the run was started with) reads their own run in
        full. A run of a PUBLIC rig — one bound to an active, published rig
        listing — is readable by anyone holding its run id, no auth at all;
        that view strips the runner's identity (owner scope, session ids,
        IPs, emails, credential-shaped keys). Anything else is 404
        `run_not_found`. Unpublishing the listing makes its runs private
        again. A caller that sends an identity and names an id that is
        neither theirs nor public gets the empty `starting` view (their own
        run may not have written its first trace yet).
      operationId: getRigRun
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: x-anon-session-id, in: header, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run as its traces tell it
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  run_id: { type: string, format: uuid }
                  status: { type: string, description: "starting · running · success · partial · error" }
                  done: { type: boolean }
                  visibility: { type: string, enum: [public, private], description: "Absent on the empty `starting` view" }
                  output: { description: "The last step's result, once done (a stage run carries a rokha_app block)" }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        trace_id: { type: string, description: "Readable at GET /api/traces/{id}" }
                        step: { type: string }
                        status: { type: string }
                        error: { description: "The step's error object, or null" }
                  traces: { type: array, items: { type: object, additionalProperties: true } }
        '400':
          description: "`bad_run_id` — a run id is a UUID"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RigDoorError' }
        '401':
          description: "`token_rejected` — drop the header to read a public run"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RigDoorError' }
        '404':
          description: "`run_not_found` — not your run and not a public rig's run"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RigDoorError' }
        '502':
          description: "`traces_unavailable` — poll again"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RigDoorError' }

  /api/rigs/{id}:
    get:
      tags: [rigs]
      summary: Get a rig
      operationId: getRig
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Rig }
    put:
      tags: [rigs]
      summary: Update a rig
      operationId: updateRig
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated rig }

  /api/rigs/{id}/harnesses:
    get:
      tags: [rigs]
      summary: List a rig's harness memberships (position + role)
      operationId: listRigHarnesses
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Memberships }
    post:
      tags: [rigs]
      summary: Add a harness to a rig
      operationId: addRigHarness
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                harness_id: { type: string }
                position: { type: integer }
                role: { type: string }
      responses:
        '200': { description: Membership created }

  /api/traces:
    get:
      tags: [rigs]
      summary: List the caller's run traces (newest first)
      description: >-
        Your own traces. `Authorization: Bearer <token>` alone — no
        `x-wallet-address` header is needed any more. Without a token: 401.
        To read a public rig's run, use GET /api/rigs/runs/{run_id} or
        GET /api/traces/{id}, which need no token.
      operationId: listTraces
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: run_id, in: query, schema: { type: string }, description: "Every trace one run wrote" }
        - { name: parent_trace_id, in: query, schema: { type: string } }
        - { name: harness_id, in: query, schema: { type: string } }
        - { name: rig_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: trace_kind, in: query, schema: { type: string } }
        - { name: node_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: "Traces: { success, data, total, limit, offset }"
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401':
          description: "`unauthorized` (no token) or `token_rejected`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [rigs]
      summary: Record a trace (one harness/rig × a result)
      operationId: createTrace
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                harness_id: { type: string }
                rig_id: { type: string }
                trace_kind: { type: string, enum: [atomic, run] }
                input: { type: object, additionalProperties: true }
                result: {}
                status: { type: string, enum: [success, error, partial, running] }
                metadata: { type: object, additionalProperties: true }
      responses:
        '200': { description: Created trace }

  /api/traces/{id}:
    get:
      tags: [rigs]
      summary: Get a trace — yours in full, or any public rig's run
      description: >-
        One door for every reader. The owner — `Authorization: Bearer <token>`
        alone, or the `x-anon-session-id` that ran it — gets the full record.
        Anyone else, with or without a token, gets the stripped public view
        when the trace belongs to a run of a PUBLIC rig (bound to an active,
        published rig listing; decided from the run's root, so one run is
        public or private as a whole). The public view drops the runner's
        identity: owner scope, user context, session ids, IPs, emails,
        credential-shaped keys, and every occurrence of the runner's identity
        string (replaced by `[runner]`). Everything else answers 404
        `trace_not_found` — the same answer as an id that never existed.
      operationId: getTrace
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: x-anon-session-id, in: header, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      id: { type: string }
                      run_id: { type: [string, 'null'] }
                      rig_id: { type: [string, 'null'] }
                      trace_kind: { type: string }
                      status: { type: string }
                      input: {}
                      result: {}
                      visibility: { type: string, enum: [public, private] }
        '400':
          description: "`bad_trace_id` — a trace id is a UUID"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "`token_rejected` — drop the header to read a public trace"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "`trace_not_found`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: "`traces_unavailable` — try again"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/anon/rigs:
    get:
      tags: [rigs]
      summary: Pre-login Working Rig surface (anon mirror)
      description: |
        The pre-login mirror of the rigs/harnesses/traces surface. All verbs
        and subpaths of `/api/rigs`, `/api/harnesses`, and `/api/traces` are
        available under `/api/anon/...`, scoped to an ephemeral visitor
        identity supplied in the `x-anon-session-id` header (no JWT). A fresh
        id is a fresh slate; abandoned anon data expires after ~24h.
      operationId: anonRigs
      parameters:
        - name: x-anon-session-id
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rigs for this anon session }

  # ============================================================
  # Paper trading — real quotes, a recorded ledger, NO money moves
  # ============================================================

  /api/signet/paper:
    post:
      tags: [signet]
      summary: Paper trading — watch a wallet, paper buy/sell, read the ledger
      description: >-
        PAPER: every fill is priced by a real Jupiter quote (USDC in for a
        buy, USDC out for a sell) and written to the caller's own durable
        ledger. No mandate, no signature, no funds — nothing on this door can
        reach the signer. No quote is a refusal, never a made-up price. The
        owner is the verified token; ledgers are for signed-in accounts only
        (an `anon:` scope answers `sign_in_required`). Every paper answer
        carries `paper: true` — report it as PAPER.


        One door, five actions, chosen by `action`:

        - `wallet_activity` `{address, limit? (1..50, default 20), since? (unix secs), before? (a signature)}`
          → `{address, count, swaps: [{signature, time, token_in: {mint, amount}, token_out: {mint, amount}, source}], as_of}`
          — a Solana wallet's recent swaps from Helius, newest first; `token_in` is what the
          wallet gave, `token_out` what it got. `helius_not_configured` means the deployment
          has no Helius key — it is not an empty wallet.

        - `paper_buy` `{ledger?, mint, amount_usd | amount_tokens, symbol?, reason?, source_signature?}`
          or `{ledger?, buys: [...]}` (up to 20 fills)
          → `{paper, ledger, action, fills: [{mint, amount, price_usd, cost_usd, source_signature}], skipped: [{mint, source_signature, reason: "already_mirrored"}]}`.
          A `source_signature` already in the ledger is skipped, so a copy-trade loop never
          mirrors a swap twice. `mint` is a full mint address, or `SOL` / `USDC`.

        - `paper_sell` `{ledger?, mint, fraction? ((0,1], default 1 = all) | amount_tokens?, reason?}`
          or `{ledger?, sells: [...]}`
          → `{paper, ledger, action, fills: [{mint, amount, exit_price_usd, proceeds_usd, realized_usd}]}`.

        - `paper_positions` `{ledger?}`
          → `{paper, ledger, open: [{mint, symbol?, amount, entry_price_usd, cost_usd, mark_price_usd, unrealized_usd, opened_at, source_signature?}],
          closed: [{mint, amount, entry_price_usd, exit_price_usd, realized_usd, opened_at, closed_at, reason?}],
          totals: {realized_usd, unrealized_usd, open_count, closed_count, win_rate}, as_of}`
          — open positions marked at a live quote (`mark_price_usd` null when no quote).

        - `paper_reset` `{ledger}` → `{paper, ledger, action, cleared}` — deletes the ledger and every trade in it.


        `ledger` is 1–40 characters of a-z, 0-9 and '-' (default `default`).
        Caps: 20 ledgers per account, 500 open positions per ledger, 20 fills
        per call, $1,000,000 per fill; 60 calls a minute per action
        (`wallet_activity`: 20). MCP twins on `/mcp/jsonrpc`:
        `signet_wallet_activity`, `signet_paper_buy`, `signet_paper_sell`,
        `signet_paper_positions`, `signet_paper_reset`.
      operationId: signetPaper
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: true
              properties:
                action: { type: string, enum: [wallet_activity, paper_buy, paper_sell, paper_positions, paper_reset] }
                ledger: { type: string, pattern: '^[a-z0-9-]{1,40}$', default: default }
                address: { type: string, description: "wallet_activity: the Solana wallet" }
                limit: { type: integer, minimum: 1, maximum: 50 }
                since: { type: integer, description: "wallet_activity: only swaps after this unix time" }
                before: { type: string, description: "wallet_activity: page back from this signature" }
                mint: { type: string, description: "Full mint address, or SOL / USDC" }
                amount_usd: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
                amount_tokens: { type: number, exclusiveMinimum: 0 }
                fraction: { type: number, exclusiveMinimum: 0, maximum: 1 }
                symbol: { type: string, maxLength: 16 }
                reason: { type: string, maxLength: 200 }
                source_signature: { type: string, maxLength: 120 }
                buys: { type: array, maxItems: 20, items: { type: object, additionalProperties: true } }
                sells: { type: array, maxItems: 20, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: The action's answer (shapes above)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: >-
            Refused — `{paper: true, status: "refused", code, error}`. Codes include
            `sign_in_required`, `bad_ledger`, `bad_action`, `bad_amount`, `no_quote`,
            `no_position`, `position_cap`, `too_many_trades`, `bad_address`,
            `helius_not_configured`, `helius_error`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperRefusal' }
        '429':
          description: "`rate_limited`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperRefusal' }

  # ============================================================
  # Data attachments — your own data, fed to a rig as fenced DATA
  # ============================================================

  /api/signet/pledge-pools:
    post:
      tags: [pledges]
      summary: Open a pledge pool you will judge (approved organisers only)
      description: >-
        Opens a pool: one SPL mint, one stake size, a lock time and a deadline. LIMITED
        to approved organisers for now (superadmins + the `SIGNET_POOL_ORGANISERS`
        allowlist) — anyone else is refused `organiser_not_allowed` (403); joining a pool
        is open to everyone. Terms never change once opened. The organiser may later give
        each funded pledge exactly one outcome — `burn` (a real token-program burn of
        exactly the stake; supply falls) or `release` — and only as the pool's published
        result names it. No door takes a destination from the organiser: a pledge can never
        be SENT anywhere. MCP twin: `signet_pledge_pool_open`.
      operationId: signetPledgePoolOpen
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title, mint, stake_amount, max_pledges, locks_at, release_at]
              properties:
                slug: { type: string, description: "Unique among your pools." }
                title: { type: string, maxLength: 120 }
                mint: { type: string, description: The SPL token mint pledgers stake. }
                stake_amount: { type: string, description: "Stake per pledge in base units, a whole-number string > 0." }
                max_pledges: { type: integer, minimum: 2, maximum: 256 }
                locks_at: { type: string, format: date-time, description: At least a minute from now. }
                release_at: { type: string, format: date-time, description: 5 minutes to 30 days after locks_at. }
                judge_agent: { type: string, description: Optional id of one of YOUR agents, shown as the judge. }
                meta: { type: object, description: "Optional public JSON (≤ 64 KB), e.g. contest rules (`meta.arena`)." }
      responses:
        '200':
          description: Opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  pool: { $ref: '#/components/schemas/PledgePool' }
        '400': { $ref: '#/components/responses/PledgeError' }
        '403': { $ref: '#/components/responses/PledgeError' }
        '409': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledge-pools/{id}:
    get:
      tags: [pledges]
      summary: Read a pledge pool and every pledge (public)
      description: >-
        Public, no login. The pool's terms, `phase` (`open` · `locked` · `released`), the
        organiser's `meta`, the published `result`, and every pledge. A pledger appears as a
        per-pool fingerprint, never an owner id. `handle` is the pledger's claimed Rokha page
        handle, stamped by erebus from the verified owner — the one identity a contest may
        match on (null for `pending`/`withdrawn` pledges). MCP twin: `signet_pledge_pool`.
      operationId: signetPledgePoolGet
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The pool
          content:
            application/json:
              schema:
                type: object
                properties:
                  pool: { $ref: '#/components/schemas/PledgePool' }
                  pledges:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Pledge' }
                        - type: object
                          properties:
                            handle: { type: string, nullable: true }
                  as_of: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledge-pools/{id}/cancel:
    post:
      tags: [pledges]
      summary: Cancel your pool — every undecided pledge is free at once
      description: Outcomes already given stand. MCP twin `signet_pledge_pool_cancel`.
      operationId: signetPledgePoolCancel
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "`{ok, status: cancelled, note}`"
        '404': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledge-pools/{id}/pledges:
    post:
      tags: [pledges]
      summary: Join an open pool — returns a deposit address to fund
      description: >-
        One pledge per account per pool (`already_pledged`); the organiser cannot pledge into
        their own pool (`organiser_cannot_pledge`). Send `fund.stake_amount` of `fund.mint`
        plus `fund.sol_lamports` of SOL to `fund.deposit_address` (a session account the
        signer holds), then confirm before `fund.before`. MCP twin `signet_pledge`.
      operationId: signetPledgeCreate
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payout_address]
              properties:
                payout_address: { type: string, description: Solana address a prize is sent to. Public. }
                memo: { type: string, maxLength: 200, description: "Public note; for a sealed entry, the answer's sha256 commitment." }
      responses:
        '200':
          description: Pledge created (pending until confirmed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  pledge: { $ref: '#/components/schemas/Pledge' }
                  fund:
                    type: object
                    properties:
                      deposit_address: { type: string }
                      mint: { type: string }
                      stake_amount: { type: string }
                      sol_lamports: { type: string }
                      before: { type: string, format: date-time }
                  next: { type: string }
        '400': { $ref: '#/components/responses/PledgeError' }
        '403': { $ref: '#/components/responses/PledgeError' }
        '404': { $ref: '#/components/responses/PledgeError' }
        '409': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledges/{id}/confirm:
    post:
      tags: [pledges]
      summary: Check the deposit on-chain and mark the pledge funded
      description: >-
        Only a funded pledge is an entry. Refused `stake_short` / `sol_short` when the deposit
        account is short, `pool_closed` / `pool_full` when the pool has locked or filled.
        Idempotent (`already: true`). MCP twin `signet_pledge_confirm`.
      operationId: signetPledgeConfirm
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "`{ok, status: funded, locks_at, release_at}` or `{ok, status: funded, already: true}`"
        '400': { $ref: '#/components/responses/PledgeError' }
        '404': { $ref: '#/components/responses/PledgeError' }
        '409': { $ref: '#/components/responses/PledgeError' }
        '502': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledges/{id}/reference:
    post:
      tags: [pledges]
      summary: Attach a short public reference to your pledge
      description: 1–200 printable characters, while the pledge awaits an outcome. MCP twin `signet_pledge_reference`.
      operationId: signetPledgeReference
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference: { type: string, maxLength: 200 }
      responses:
        '200': { description: "`{ok, reference}`" }
        '400': { $ref: '#/components/responses/PledgeError' }
        '404': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledges/{id}/withdraw:
    get:
      tags: [pledges]
      summary: Can this pledge be withdrawn now, and where to
      description: >-
        Destinations are ONLY addresses provably yours: your sign-in wallet, your payout
        address, or an address that funded the pledge. MCP twin `signet_pledge_withdraw`
        (without `to`).
      operationId: signetPledgeWithdrawOptions
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Withdraw options
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge: { $ref: '#/components/schemas/Pledge' }
                  phase: { type: string, enum: [open, locked, released] }
                  can_withdraw: { type: boolean }
                  why_not: { type: object, nullable: true, properties: { error: { type: string }, message: { type: string } } }
                  locks_at: { type: string, format: date-time }
                  release_at: { type: string, format: date-time }
                  portfolio: { type: object, nullable: true }
                  destinations:
                    type: array
                    items: { type: object, properties: { address: { type: string }, why: { type: string } } }
        '404': { $ref: '#/components/responses/PledgeError' }
    post:
      tags: [pledges]
      summary: Empty the pledge account to one of your own addresses
      description: >-
        Refused `locked` (409) while the pool is locked and the pledge has no outcome,
        `settling` while a burn is in flight, `destination_not_allowed` for any address not in
        the GET list. Withdrawing a funded pledge before the lock cancels the entry.
      operationId: signetPledgeWithdraw
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string }
      responses:
        '200': { description: "`{ok, result}` — the signer's sweep receipt" }
        '400': { $ref: '#/components/responses/PledgeError' }
        '404': { $ref: '#/components/responses/PledgeError' }
        '409': { $ref: '#/components/responses/PledgeError' }
        '502': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledges/{id}/disclose:
    post:
      tags: [pledges]
      summary: Publish one public JSON on your funded pledge (the reveal)
      description: >-
        Only while the pool is locked, only once, never rewritten; ≤ 64 KB. For a sealed
        entry: the answer + salt whose fingerprint is the pledge memo. Refused `not_locked`
        outside the lock window, `bad_disclosure` for a bad body. MCP twin
        `signet_pledge_disclose`.
      operationId: signetPledgeDisclose
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disclosure]
              properties:
                disclosure: { type: object }
      responses:
        '200': { description: "`{ok, disclosed: true}`" }
        '400': { $ref: '#/components/responses/PledgeError' }
        '404': { $ref: '#/components/responses/PledgeError' }
        '409': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledges/mine:
    get:
      tags: [pledges]
      summary: Your pledges (newest first, up to 200)
      description: MCP twin `signet_pledges_mine`.
      operationId: signetPledgesMine
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "`{pledges: [Pledge + pool_id]}`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledges:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Pledge' }
                        - type: object
                          properties:
                            pool_id: { type: string, format: uuid }

  /api/signet/pledge-pools/{id}/result:
    post:
      tags: [pledges]
      summary: Publish the pool's result — once, after it locks
      description: >-
        One public JSON object (≤ 256 KB), never rewritten. It MUST carry `verdict_hash`
        (64 lowercase hex) and `outcomes` (pledge id → `burn` | `release`); anything else is
        `bad_result`. A second publish or a pool that has not locked → `result_refused`
        (409). MCP twin `signet_pledge_pool_result`.
      operationId: signetPledgePoolResult
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: object
                  required: [verdict_hash, outcomes]
                  properties:
                    verdict_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
                    outcomes:
                      type: object
                      additionalProperties: { type: string, enum: [burn, release] }
      responses:
        '200': { description: "`{ok, published: true}`" }
        '400': { $ref: '#/components/responses/PledgeError' }
        '409': { $ref: '#/components/responses/PledgeError' }

  /api/signet/pledge-pools/{id}/outcomes:
    post:
      tags: [pledges]
      summary: Burn or release 1–16 funded pledges, as the published result names them
      description: >-
        Outcomes come ONLY from the published result: no result → `result_required`; an
        outcome the result does not name for that pledge → `outcome_not_in_result`. Only
        while the pool is locked (`not_locked`), once per pledge. `burn` destroys exactly
        the stake (token-program burn); `release` frees it for the pledger. A burn whose
        fate is unknown is parked (`burn_unconfirmed`, status `burning`) and never re-sent.
        Per-pledge results; the call answers 200 with each item's `ok`. MCP twin
        `signet_pledge_outcomes`.
      operationId: signetPledgeOutcomes
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcomes]
              properties:
                outcomes:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [pledge_id, outcome]
                    properties:
                      pledge_id: { type: string, format: uuid }
                      outcome: { type: string, enum: [burn, release] }
      responses:
        '200':
          description: Per-pledge results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  pool_id: { type: string, format: uuid }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        pledge_id: { type: string, format: uuid }
                        ok: { type: boolean }
                        status: { type: string, enum: [funded, burning, burned, released] }
                        signature: { type: string, description: The burn transaction (burned only). }
                        amount: { type: string }
                        error: { type: string }
                        message: { type: string }
        '400': { $ref: '#/components/responses/PledgeError' }
        '404': { $ref: '#/components/responses/PledgeError' }
        '409': { $ref: '#/components/responses/PledgeError' }

  /api/data-attachments:
    get:
      tags: [data]
      summary: List your data attachments (newest first, without content)
      description: >-
        Your own JSON / CSV / XML / YAML / text files, kept for rigs to read
        as fenced DATA (never instructions). Owner-scoped: a foreign id is a
        404. Google sign-ins send the Bearer token alone; a wallet sign-in
        also sends `x-wallet-address: <the wallet in the token>`.
      operationId: listDataAttachments
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "`{data: [DataAttachment], limit: 200, max_bytes: 524288}`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DataAttachment' } }
                  limit: { type: integer }
                  max_bytes: { type: integer }
    post:
      tags: [data]
      summary: Create a data attachment
      description: >-
        Content is parse-checked for its `format` and a schema is inferred.
        At most 512 KB each and 200 per account.
      operationId: createDataAttachment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, format, content]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                format: { $ref: '#/components/schemas/DataAttachmentFormat' }
                role: { $ref: '#/components/schemas/DataAttachmentRole' }
                content: { type: string }
                source: { type: string, enum: [user, rokha], default: user, description: "`run_output` is minted only by POST /api/data-attachments/from-run" }
      responses:
        '201':
          description: "`{data: DataAttachment}`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataAttachmentEnvelope' }
        '400': { $ref: '#/components/responses/DataAttachmentError' }
        '413': { $ref: '#/components/responses/DataAttachmentError' }
        '422': { $ref: '#/components/responses/DataAttachmentError' }
        '429': { $ref: '#/components/responses/DataAttachmentError' }

  /api/data-attachments/templates:
    get:
      tags: [data]
      summary: A starter template per format
      operationId: dataAttachmentTemplates
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "`{data: {json, csv, xml, yaml, text}}` — each a template string"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/data-attachments/from-run:
    post:
      tags: [data]
      summary: Save one of your runs' output as an attachment
      description: >-
        Name a `trace_id` or a `run_id` (a run's `run` trace, else its first).
        Only your own traces are read. The output is saved as `json` when it
        parses, else `text`, with `source: run_output`.
      operationId: dataAttachmentFromRun
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                trace_id: { type: string, format: uuid }
                run_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 120 }
                role: { $ref: '#/components/schemas/DataAttachmentRole' }
      responses:
        '201':
          description: "`{data: DataAttachment}`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataAttachmentEnvelope' }
        '400': { $ref: '#/components/responses/DataAttachmentError' }
        '404': { $ref: '#/components/responses/DataAttachmentError' }
        '422':
          $ref: '#/components/responses/DataAttachmentError'

  /api/data-attachments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [data]
      summary: One attachment, with its content
      operationId: getDataAttachment
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "`{data: DataAttachment}` including `content`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataAttachmentEnvelope' }
        '404': { $ref: '#/components/responses/DataAttachmentError' }
    put:
      tags: [data]
      summary: Update an attachment (any field; the rest are kept)
      operationId: updateDataAttachment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                format: { $ref: '#/components/schemas/DataAttachmentFormat' }
                role: { $ref: '#/components/schemas/DataAttachmentRole' }
                content: { type: string }
      responses:
        '200':
          description: "`{data: DataAttachment}`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataAttachmentEnvelope' }
        '400': { $ref: '#/components/responses/DataAttachmentError' }
        '404': { $ref: '#/components/responses/DataAttachmentError' }
        '413': { $ref: '#/components/responses/DataAttachmentError' }
        '422': { $ref: '#/components/responses/DataAttachmentError' }
    delete:
      tags: [data]
      summary: Delete an attachment
      operationId: deleteDataAttachment
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "`{ok: true}`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '404': { $ref: '#/components/responses/DataAttachmentError' }

  # ============================================================
  # Agent choreographies (SSE)
  # ============================================================

  /api/agents/rokha-agent/remix/stream/public:
    post:
      tags: [agents]
      summary: "Remix (SSE): the agent builds a rig from a random skill, live"
      description: |
        Server-Sent Events choreography — the agent discovers a random
        registry skill, targets it as the Working Rig's harness, fills the
        build config, and hands off to a run. Events: `content`,
        `tool_start`, `tool_result`, `ui_directive`, `done`. Anon-scoped via
        request `user_context.anon_session_id`.
      operationId: remixStream
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                user_context: { type: object, additionalProperties: true }
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema: { type: string }

  /api/runtime/taste:
    post:
      tags: [runtime]
      summary: "Run for real (free public taste)"
      description: |
        The public conversion door: ONE real sandbox run per anon session per
        day, inside the global daily budget. No auth — the caller supplies an
        `anon_session_id` (UUID) that scopes the free run. Executes the skill
        in the isolated egress-only, no-secrets Fargate sandbox and writes a
        trace anchored to `harness_id` (the run IS its own receipt).
      operationId: runtimeTaste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anon_session_id, skill_provider, skill_slug, harness_id]
              properties:
                anon_session_id: { type: string, format: uuid }
                skill_provider: { type: string }
                skill_slug: { type: string }
                instruction: { type: string }
                params: { type: object, additionalProperties: true }
                harness_id: { type: string, format: uuid }
      responses:
        '200':
          description: Run acknowledgement (carries a run_id to poll)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: Bad input (non-UUID id, invalid params) }
        '429': { description: Free-run budget exhausted for the session/day }

  /api/runtime/run:
    post:
      tags: [runtime]
      summary: "Run for real (logged-in, tier quota)"
      description: |
        The authenticated run door — draws from the caller's tier daily quota
        (not the anon free-taste), still under the global token ceiling. Owner
        is derived from the verified JWT. Writes a trace anchored to
        `harness_id`.
      operationId: runtimeRun
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_provider, skill_slug, harness_id]
              properties:
                skill_provider: { type: string }
                skill_slug: { type: string }
                instruction: { type: string }
                params: { type: object, additionalProperties: true }
                harness_id: { type: string, format: uuid }
                model: { type: string }
      responses:
        '200':
          description: Run acknowledgement (carries a run_id to poll)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not authenticated }
        '429': { description: Tier daily quota exhausted }

  /api/runtime/runs/{run_id}/progress:
    get:
      tags: [runtime]
      summary: "Live run progress"
      description: Poll a run's live stage events by run id (run-token gated server-side).
      operationId: runtimeProgress
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Progress snapshot
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/agents/rokha-agent/run/stream:
    post:
      tags: [agents]
      summary: "Run (SSE, authenticated): execute the caller's saved Rig"
      description: |
        The authenticated twin of the public run stream — scoped to the
        caller's real identity (bearer JWT). Multi-harness Rigs run as a
        threaded flow: a parent `run` trace plus per-step `atomic` traces,
        each step's output feeding the next.
      operationId: runStreamAuthed
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                user_context: { type: object, additionalProperties: true }
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema: { type: string }

  /api/agents/rokha-agent/run/stream/public:
    post:
      tags: [agents]
      summary: "Run (SSE): the agent executes the saved Working Rig's harness"
      description: |
        Server-Sent Events choreography — the agent reads the caller's SAVED
        Working Rig and executes its harness: a live MCP `tools/call` when an
        endpoint + tool are configured, a `tools/list` probe when only an
        endpoint is set, or an agentic run (the agent performs the skill from
        its description + instruction + params) when neither — then writes an
        atomic trace. Events: `content`, `tool_start`, `tool_result`,
        `ui_directive`, `run_result` ({status, latency_ms, trace_id}),
        `done`. Anon-scoped via `user_context.anon_session_id`.
      operationId: runStream
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                user_context: { type: object, additionalProperties: true }
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema: { type: string }

  # ============================================================
  # OAuth broker — "auth, credentials, sessions handled for you"
  # ============================================================
  /api/oauth/resolve:
    get:
      tags: [oauth]
      summary: "Auth ladder: how does this MCP server authenticate?"
      description: |
        Classify any MCP server URL so a client knows the ONE next step:
        `open` (no credential — just call it), `key` (save a token in the
        vault once, then attach via `secret_refs`), `tier1` (a known provider —
        one-click account-wide OAuth Connect at `/api/oauth/connect/{provider}`),
        or `oauth_spec` (the server speaks the MCP auth spec — connect it
        directly via `POST /api/oauth/connect/mcp`; Rokha discovers its auth
        server and dynamically registers as a client). The response `hint`
        spells out the step.
      operationId: oauthResolve
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: server
          required: true
          schema: { type: string }
      responses:
        '200':
          description: "{ mode, hint, provider?, alias? }"
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/oauth/connect/{provider}:
    get:
      tags: [oauth]
      summary: "Start a Tier-1 OAuth Connect (returns the consent URL)"
      description: |
        Begin a one-click Connect for a known provider (github, google, x,
        atlassian, microsoft, slack, notion, gitlab, discord, reddit, linear).
        Returns `redirect_url` to open in a browser; on approval the token
        lands in the caller's vault as `oauth-<provider>` (account-wide,
        refreshed automatically), usable via `secret_refs`. 503 if the
        provider isn't configured on the deployment.
      operationId: oauthConnect
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        '200':
          description: "{ redirect_url, provider, alias }"
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/oauth/connect/mcp:
    post:
      tags: [oauth]
      summary: "Connect any MCP-auth-spec server (dynamic client registration)"
      description: |
        The Tier-2 handshake: given `{ server_url }`, Rokha probes the server,
        discovers its protected-resource + authorization-server metadata,
        dynamically registers itself as a client (RFC 7591), and returns a
        PKCE consent `redirect_url`. On approval the token is stored in the
        vault as `mcp-<host>`, bound to that server, refreshed automatically.
      operationId: oauthConnectMcp
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { server_url: { type: string } }, required: [server_url] } } }
      responses:
        '200':
          description: "{ redirect_url, mode, issuer, alias }"
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/oauth/connections:
    get:
      tags: [oauth]
      summary: "List the caller's OAuth connections + available providers"
      operationId: oauthConnections
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: "{ connected: [...], available: [...] }"
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/oauth/callback/{provider}:
    get:
      tags: [oauth]
      summary: "OAuth redirect callback (browser; not called directly)"
      description: |
        The provider's redirect target. Authenticated by a sealed state
        parameter (no JWT). Exchanges the code, stores the grant, and
        redirects home with `?oauth=<id>&status=connected`.
      operationId: oauthCallback
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        '307': { description: Redirect home with a status query param }

  # ============================================================
  # User MCP gateway — one endpoint, all your servers, auth injected
  # ============================================================
  /api/gateway/servers:
    get:
      tags: [gateway]
      summary: "List servers registered behind your Rokha gateway"
      operationId: gatewayList
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: "{ servers: [...], gateway_url }"
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
    post:
      tags: [gateway]
      summary: "Register an external MCP server behind the gateway"
      description: |
        Bundle an external MCP server behind your ONE gateway endpoint.
        `secret_alias` names the vault key/OAuth grant that authenticates it
        (omit for open servers); `header_name`/`header_prefix` shape the
        injected auth header (default `Authorization: Bearer `). Its tools
        then appear at the gateway namespaced `<slug>_<tool>`. Cap 20.
      operationId: gatewayRegister
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                server_url: { type: string }
                secret_alias: { type: string }
                header_name: { type: string }
                header_prefix: { type: string }
              required: [name, server_url]
      responses:
        '200':
          description: "{ id, slug, gateway_url }"
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/gateway/servers/{id}:
    delete:
      tags: [gateway]
      summary: "Remove a server from your gateway"
      operationId: gatewayRemove
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: "{ ok }", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/gateway/mcp:
    post:
      tags: [gateway]
      summary: "The gateway MCP door — aggregated tools from all your servers"
      description: |
        MCP JSON-RPC over one endpoint. `initialize` answers as
        `rokha-gateway`; `tools/list` fans out to every registered server
        (credentials injected server-side, just-in-time OAuth refresh) and
        returns the union namespaced `<slug>_<tool>` (partial fan-out reports
        `_meta.unavailable`); `tools/call` de-namespaces and forwards with the
        credential injected. The client holds ONLY its Rokha JWT — real keys
        never leave the platform. Point any MCP client (Claude Code, Cursor,
        an agent) here to reach all your servers through one connection.
      operationId: gatewayMcp
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MCPJsonRpcRequest' } } }
      responses:
        '200':
          description: JSON-RPC response
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPJsonRpcResponse' } } }

  # ============================================================
  # MCP OAuth server — Rokha as an auth-spec resource+authorization server
  # ============================================================
  /.well-known/oauth-protected-resource:
    get:
      tags: [oauth]
      summary: "MCP-auth-spec protected-resource metadata (RFC 9728)"
      description: |
        Names Rokha's authorization server + scopes for the MCP door. Modern
        MCP clients fetch this after a 401 (the `/mcp/jsonrpc` 401 carries a
        `WWW-Authenticate: Bearer resource_metadata="…"` header) to auto-start
        the OAuth flow.
      operationId: oauthProtectedResourceMetadata
      responses: { '200': { description: metadata, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      summary: "MCP-auth-spec authorization-server metadata (RFC 8414)"
      description: "Advertises authorize/token/register endpoints, PKCE S256, and the authorization_code + refresh_token grants."
      operationId: oauthAuthorizationServerMetadata
      responses: { '200': { description: metadata, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /oauth/register:
    post:
      tags: [oauth]
      summary: "Dynamic client registration (RFC 7591)"
      description: "An MCP client self-registers with `{ client_name, redirect_uris[] }` and gets a public PKCE `client_id` (no secret)."
      operationId: oauthRegisterClient
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { client_name: { type: string }, redirect_uris: { type: array, items: { type: string } } }, required: [redirect_uris] } } } }
      responses: { '200': { description: "{ client_id, redirect_uris, token_endpoint_auth_method }", content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /oauth/authorize:
    get:
      tags: [oauth]
      summary: "OAuth 2.1 authorization endpoint (PKCE S256)"
      description: |
        The browser lands here from an MCP client. Validates the client +
        registered redirect_uri + S256 PKCE, then redirects to the `/connect`
        consent page where the human logs in and approves. On approval a
        single-use, PKCE-bound code redirects back to the client.
      operationId: oauthAuthorize
      parameters:
        - { in: query, name: client_id, required: true, schema: { type: string } }
        - { in: query, name: redirect_uri, required: true, schema: { type: string } }
        - { in: query, name: response_type, required: true, schema: { type: string, enum: [code] } }
        - { in: query, name: code_challenge, required: true, schema: { type: string } }
        - { in: query, name: code_challenge_method, required: true, schema: { type: string, enum: [S256] } }
        - { in: query, name: state, schema: { type: string } }
      responses: { '307': { description: Redirect to the consent page } }
  /oauth/token:
    post:
      tags: [oauth]
      summary: "OAuth 2.1 token endpoint (authorization_code + refresh_token)"
      description: |
        `grant_type=authorization_code` (with `code`, `code_verifier`,
        `client_id`, `redirect_uri`) exchanges a consented code for a Bearer
        access token + a rotating refresh token — the Bearer the MCP doors
        accept. `grant_type=refresh_token` renews without another human consent.
      operationId: oauthToken
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, properties: { grant_type: { type: string }, code: { type: string }, code_verifier: { type: string }, client_id: { type: string }, redirect_uri: { type: string }, refresh_token: { type: string } }, required: [grant_type] } } } }
      responses: { '200': { description: "{ access_token, token_type, expires_in, refresh_token, scope }", content: { application/json: { schema: { type: object, additionalProperties: true } } } } }

