    post:
      tags: [sales]
      summary: "Create — or retitle, keyed by slug — a pack of items you own (MCP pack_create)"
      description: >-
        A PACK is a creator's priced set of rigs, skills, harnesses and agents: one purchase
        unlocks every item in it (`one_time` forever, `monthly` for 30 days, `per_run` spends the
        pack's runs across its items). Make it here, fill it with `PUT /api/packs/{id}/items`,
        then price it with `PUT /api/products {kind: pack, ref: <pack id>}`. A pack with no price
        grants nothing. You keep 80% of each sale. JWT only — an `rk_` key is refused.
      operationId: packCreate
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title]
              properties:
                slug: { type: string, pattern: '^[a-z0-9_-]{1,60}$' }
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 2000 }
      responses:
        '200': { description: "`{ok, pack, next}`", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, pack: { $ref: '#/components/schemas/Pack' }, next: { type: string } } } } } }
        '400': { description: "`bad_pack` — the slug, title or description is out of shape", content: { application/json: { schema: { $ref: '#/components/schemas/SaleRefusal' } } } }
        '401': { description: "`sign_in`" }
        '403': { description: "`key_cannot` — an rk_ key can read, run and buy; sign in to build packs", content: { application/json: { schema: { $ref: '#/components/schemas/SaleRefusal' } } } }
        '409': { description: "`pack_cap` — at most 50 packs per account", content: { application/json: { schema: { $ref: '#/components/schemas/SaleRefusal' } } } }
        '503': { description: "`unavailable`" }
  /api/packs/{id}:
    get:
      tags: [sales]
      summary: "What a pack holds and what it costs (public; MCP pack_get)"
      description: >-
        Public items only (`private_items` counts the rest). With a price: `product` + `buy`
        (`checkout_url`, the MCP call and the REST door — agents pay with
        `product_checkout` rail `x402`, `usdc` or `sol`, no browser). Then run any item normally
        (`rig_run` / `POST /api/rigs/run`) — the run door sees the pack. Unpriced:
