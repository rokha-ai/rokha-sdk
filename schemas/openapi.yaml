      responses:
        '200': { description: "`{ok, pack}`", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, pack: { $ref: '#/components/schemas/Pack' } } } } } }
        '400': { description: "`bad_item` (kind is rig · skill · harness · agent) · `too_many` (100 changes per call)", content: { application/json: { schema: { $ref: '#/components/schemas/SaleRefusal' } } } }
        '403': { description: "`not_yours` — a pack holds only items you own · `key_cannot`", content: { application/json: { schema: { $ref: '#/components/schemas/SaleRefusal' } } } }
        '404': { description: "`not_found` — no pack of yours has that id" }
        '409': { description: "`pack_full` — a pack holds at most 100 items" }
        '503': { description: "`unavailable`" }
  /api/rokha/addons:
    get:
      tags: [addons]
      summary: "Your Rokha's add-ons, each with its access and the exact call that runs it (MCP rokha_addons)"
      description: >-
        An add-on is a published rig or skill attached to YOUR Rokha: every signed-in Rokha turn
        of yours lists them with the call that runs each, so she reaches for them first. A
        priced one you have not bought reads `locked` with its `buy_url` and no `run`. Every
        run bills you.
      operationId: rokhaAddonsMine
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Your add-ons
          content:
            application/json:
              schema:
                type: object
                properties:
                  addons: { type: array, items: { $ref: '#/components/schemas/RokhaAddon' } }
                  count: { type: integer }
                  cap: { type: integer, example: 24 }
        '401': { description: "`sign_in_required`" }
        '503': { description: "`unavailable`" }
    post:
      tags: [addons]
      summary: "Attach a published rig or skill to your Rokha (MCP rokha_addon_add)"
      description: >-
        Idempotent (`already: true` on a repeat). A listing that is not public attaches only for
        its owner — anyone else gets the same 404 as a missing one. Attaching NEVER unlocks a
        priced listing: it attaches `locked`, and running it still meets the 402 at the run door
        until you buy it.
      operationId: rokhaAddonAdd
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, listing_id]
              properties:
                kind: { type: string, enum: [rig, skill] }
                listing_id: { type: string, description: "A listing uuid, provider:slug, provider/slug, or a bare slug (provider rokha)" }
                note: { type: string, maxLength: 280, description: "When Rokha should reach for it" }
      responses:
        '200': { description: "`{ok, already, addon}`", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, already: { type: boolean }, addon: { $ref: '#/components/schemas/RokhaAddon' } } } } } }
        '400': { description: "`bad_kind` (rig or skill) · `bad_listing`" }
        '401': { description: "`sign_in_required`" }
        '404': { description: "`not_found` — no such listing" }
        '422': { description: "`kind_mismatch` — the listing is the other kind" }
        '429': { description: "`addon_cap` — 24 add-ons at most; remove one first" }
        '503': { description: "`unavailable`" }
  /api/rokha/addons/{kind}/{listing_id}:
