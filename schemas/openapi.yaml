  /api/amplify/campaigns:
    get:
      tags: [network]
      summary: "Rokha campaigns a roster creator can opt into (MCP amplify_campaigns)"
      description: |
        Public. The **Amplify lane**: promoters earn points for what their
        reach BRINGS to Rokha during campaigns anchored on an official
        @rokha_agent post — never for a post's likes or views. Promoters are on
        the Network like builders: a claimed page that explains their brand,
        X verified on it, then the roster (X account ≥180 days old, ≥20
        original posts in 90 days, payout wallet, clean audit; followers are
        not a gate). Opt in, get a tracked link, post as yourself (disclosed
        when a Member funds it); outcomes the link brought (a sign-in that
        goes on to run something · first run · paid run · agent connected ·
        listing created · bounty entered) land in your Brought lane. PIN OF THE
        WEEK: pin the week's official campaign post (#ad); ≥5 of 7 random
        checks; 5 / 10 / 20 points per verified day by reach tier (T1 500–2,500
        · T2 2,500–15,000 · T3 15,000+ median views per original post over 90
        days). The week's top 10 on the board are paid.
      operationId: amplifyCampaigns
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    post:
      tags: [network]
      summary: "Open a campaign anchored on an official post (superadmin, or a Member with a budget)"
      operationId: amplifyCampaignCreate
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                official_post_id: { type: string }
                title: { type: string }
                kind: { type: string, enum: [amplify, pin_week], default: amplify, description: "pin_week = the House's Pin of the Week (superadmin only)" }
                budget_usdc: { type: number }
                ends_at: { type: string, format: date-time }
      responses:
        '200': { description: Created }
        '401': { description: Not signed in }
        '403': { description: Not a Member or superadmin }
  /api/amplify/roster/join:
    post:
      tags: [network]
      summary: "Join the promoter roster (MCP amplify_roster_join)"
      description: >-
        Needs a complete Network page (display name, a bio of 40+ characters that
        explains your brand, X verified on the page, a niche in `focus`), an X
        account at least 180 days old with at least 20 original posts in 90 days,
        a Solana payout wallet and a clean red-flag audit. Followers are not a gate.
        New seats wait for founder approval.
      operationId: amplifyRosterJoin
      security: [ { bearerAuth: [] } ]
