openapi: 3.1.0
info:
  title: Rokha Public API
  description: |
    The public, agent-friendly surface of Rokha. Single source of truth
    for the contract between [rokha-sdk](https://github.com/rokha-ai/rokha-sdk)
    and the Erebus router.

    **Versioning rule (non-negotiable)**: every change to this file MUST bump
    `info.version` per semver:
      - **major** — removed endpoints, removed/renamed fields, type changes
      - **minor** — new endpoints, new optional fields
      - **patch** — documentation, examples, descriptions

    The live server's served schema MUST match the version of the deployed SDK
    they're meant to coexist with. Clients can verify via `GET /api/schema/version`.

    The full operational rule lives in the main repo's `CLAUDE.md` under
    "Public Surface Contract".
  version: 1.0.0
  license:
    name: MIT
    url: https://github.com/rokha-ai/rokha-sdk/blob/main/LICENSE
  contact:
    name: Rokha
    url: https://rokha.ai

servers:
  - url: http://localhost:3000
    description: Local development (default Erebus port)
  - url: https://erebus.rokha.ai
    description: Production (hosted Erebus)

tags:
  - name: meta
    description: Server metadata — health, info, schema, friendly LLM index
  - name: skills
    description: First-party agentskills.io skills (CORS-open, no auth)
  - name: wallets
    description: Web3 wallet challenge/verify auth (Solana, Ethereum)
  - name: auth
    description: Email + Google OAuth + JWT issue/refresh
  - name: agents
    description: Rokha chat, models, tools, history (public + signed variants)
  - name: harnesses
    description: Wallet-scoped memory/context CRUD with search (JWT + wallet sig)
  - name: mcp
    description: Model Context Protocol — tool discovery and invocation
  - name: marketplace
    description: Rokha Registry listings + third-party tool registry (ClawHub, Smithery)
  - name: discovery
    description: Live discovery of running tools, agents, protocols
  - name: llm
    description: Federated LLM proxy — caller-keyed Anthropic forwarding
  - name: rigs
    description: Rigs (workflows of configured harnesses) + run traces — the Working Rig surface
  - name: runtime
    description: Run for real — execute a skill in the isolated sandbox (free taste + tier-quota run)
  - name: analytics
    description: Privacy-safe product-analytics capture — anon-session-keyed, fire-and-forget
  - name: sales
    description: >-
      Creator sales — a creator prices a rig, skill, harness or agent (one-time, monthly
      pass, or per-run pack); buyers unlock it on their account; agents pay with x402,
      Signet or fuel. Sales open after the 2026-10-02 payout.
  - name: oauth
    description: OAuth broker — connect third-party providers + MCP-auth-spec servers; grants land in the vault
  - name: gateway
    description: User MCP gateway — one endpoint aggregating all your servers, credentials injected server-side
  - name: pages
    description: Builder Pages — every builder's public /@handle profile page + the Top Builders leaderboard
  - name: signet
    description: Signet — paper trading (real quotes, a recorded ledger, no money moves)
  - name: network
    description: The Rokha Network — join free, the Incubation board, Network Members (the week's top 10 are paid), promoters (Amplify + Pin of the Week), creator earnings, fuel boosts.
  - name: data
    description: Data attachments — your own files, fed to a rig as fenced DATA
  - name: pledges
    description: >-
      Signet pledge pools — stakes locked for a contest someone else judges; the organiser
      can only burn or release each stake as its published result names it, never send it.
  - name: signals
    description: Windsock — scored token signals (read-only market data, never advice, never trades)

security: []  # default: no auth. Routes that need it set their own.

paths:
  # ============================================================
  # Meta
  # ============================================================

  /health:
    get:
      tags: [meta]
      summary: Liveness check
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/info:
    get:
      tags: [meta]
      summary: Full route map + auth flow reference
      description: |
        Human- and agent-readable enumeration of every public API surface,
        their auth requirements, and the sensitive-data flow. Always
        current — generated from the live Erebus router.
      operationId: getApiInfo
      responses:
        '200':
          description: Full info document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /llms.txt:
    get:
      tags: [meta]
      summary: Friendly LLM-readable index
      operationId: getLlmsTxt
      responses:
        '200':
          description: Index document
          content:
            text/plain:
              schema:
                type: string

  /llms-full.txt:
    get:
      tags: [meta]
      summary: Extended agent reference
      description: >
        Everything llms.txt says plus the depth an agent needs to go from
        reading to invoking with no other documents: copy-paste JSON-RPC call
        bodies, the full limit-relay example, the official first-party catalog
        as direct markdown links, and the crawlable listing-page index.
      operationId: getLlmsFullTxt
      responses:
        '200':
          description: Extended reference document
          content:
            text/plain:
              schema:
                type: string

  /v0.1/servers:
    get:
      tags: [registry]
      summary: Generic MCP Registry API — list servers (spec-compatible mirror)
      description: >
        Serves Rokha's registry in the official MCP Registry wire shape so any
        spec-compliant client (VS Code, Copilot, MCP Hub, Azure API Center)
        discovers our listings with zero Rokha-specific code. Read-only,
        anonymous. Response envelope: `{ servers: [{ server, _meta }],
        metadata: { count, nextCursor } }`. Rokha extras live under
        `_meta["ai.rokha/listing"]` (provider, executionClass, probeVerified,
        license, downloads, url). Mirror also at `/api/registry/v0.1/servers`.
      operationId: listSpecServers
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque pagination cursor from metadata.nextCursor }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: provider, in: query, required: false, schema: { type: string }, description: Rokha extension — restrict to one source provider }
      responses:
        '200':
          description: Spec-shaped server list
          content:
            application/json:
              schema: { type: object }

  /v0.1/servers/{name}/versions/{version}:
    get:
      tags: [registry]
      summary: Generic MCP Registry API — single server detail
      description: >
        Resolve one server by its spec `name` (Rokha's external_id, which may
        contain slashes). `{version}` accepts `latest` (or the stored version);
        a concrete mismatch 404s. Returns the same `{ server, _meta }` envelope.
        The bare `/v0.1/servers/{name}` form is also served. Mirror at
        `/api/registry/v0.1/servers/...`.
      operationId: getSpecServer
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string }, description: "`latest` or a concrete version" }
      responses:
        '200':
          description: Spec-shaped server object
          content:
            application/json:
              schema: { type: object }
        '404':
          description: Unknown server name or version

  /api/schema:
    get:
      tags: [meta]
      summary: This OpenAPI specification (live)
      operationId: getSchema
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/schema/version:
    get:
      tags: [meta]
      summary: Schema version (just the semver string + metadata)
      operationId: getSchemaVersion
      responses:
        '200':
          description: Schema version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVersion'

  # ============================================================
  # Skills (agentskills.io)
  # ============================================================

  /api/skills:
    get:
      tags: [skills]
      summary: List first-party Rokha skills
      operationId: listSkills
      responses:
        '200':
          description: Skill index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsListResponse'

  /api/skills/{name}:
    get:
      tags: [skills]
      summary: Full manifest for one skill
      operationId: getSkill
      parameters:
        - $ref: '#/components/parameters/SkillName'
      responses:
        '200':
          description: Skill manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/skills/{name}/SKILL.md:
    get:
      tags: [skills]
      summary: Raw SKILL.md content
      operationId: getSkillMd
      parameters:
        - $ref: '#/components/parameters/SkillName'
      responses:
        '200':
          description: SKILL.md content
          content:
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/skills/{name}/{path}:
    get:
      tags: [skills]
      summary: Bundled file from a skill folder
      operationId: getSkillFile
      parameters:
        - $ref: '#/components/parameters/SkillName'
        - name: path
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._/-]+$
            maxLength: 256
      responses:
        '200':
          description: File content
          content:
            text/markdown:
              schema: { type: string }
            text/x-shellscript:
              schema: { type: string }
            text/x-python:
              schema: { type: string }
            application/javascript:
              schema: { type: string }
            application/json:
              schema: { type: object }
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Path escapes the skill root
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Wallets — Web3 challenge/verify auth
  # ============================================================

  /api/wallets:
    get:
      tags: [wallets]
      summary: List supported wallet types
      operationId: listSupportedWallets
      responses:
        '200':
          description: Supported wallet types per chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletListResponse'

  /api/wallets/detect:
    post:
      tags: [wallets]
      summary: Detect wallets installed in the user's browser
      description: |
        Reads the user-agent's wallet provider injections (window.ethereum,
        window.solana, etc.) — practically a hint for frontends; safe to
        skip for non-browser SDKs.
      operationId: detectWallets
      responses:
        '200':
          description: Detection result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/wallets/challenge:
    post:
      tags: [wallets]
      summary: Create a wallet signing challenge
      operationId: createWalletChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletChallengeRequest'
      responses:
        '200':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletChallengeResponse'

  /api/wallets/verify:
    post:
      tags: [wallets]
      summary: Verify a signed challenge and issue a session
      operationId: verifyWalletSignature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletVerifyRequest'
      responses:
        '200':
          description: Verified — JWT + session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/wallets/status:
    get:
      tags: [wallets]
      summary: Wallet auth status for the current session
      operationId: getWalletStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ============================================================
  # Auth — Google OAuth + JWT
  # ============================================================

  /api/auth/google/start:
    post:
      tags: [auth]
      summary: Begin Google OAuth flow
      description: Returns the URL the client should redirect to.
      operationId: googleAuthStart
      responses:
        '200':
          description: OAuth start URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url: { type: string, format: uri }
                  state: { type: string }

  /api/auth/google/callback:
    get:
      tags: [auth]
      summary: Google OAuth callback
      operationId: googleAuthCallback
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'

  # `/api/auth/token` was removed. Every JWT is now issued by a flow that
  # verifies control of the identity first: the wallet challenge/verify pair,
  # a Google / MCP OAuth code exchange, the CLI device flow, or a refresh of
  # an already-valid token.

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the presented token
      description: |
        Revokes the bearer token you send, server-side. Idempotent — always
        answers 200, whether or not the token was already revoked or expired.
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token revoked (or already was)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh an expiring JWT
      operationId: authRefresh
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # CLI device authorization (RFC 8628 adapted) — `ro login`.
  # See docs-internal/src/operations/cli-device-flow.md.
  # ============================================================

  /api/auth/cli/start:
    post:
      tags: [auth]
      summary: Start a CLI device-flow authorization
      description: |
        Anonymous. The CLI calls this to obtain a `device_code` (opaque,
        kept private) + `user_code` (short, shown to the user). The user
        completes the flow at `verification_uri` in a browser.
      operationId: cliAuthStart
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  default: cli
                client:
                  type: string
                  description: Self-reported client identifier (e.g. `ro/0.2.0`).
      responses:
        '200':
          description: Device flow initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliDeviceStartResponse'

  /api/auth/cli/poll:
    post:
      tags: [auth]
      summary: Poll for device-flow authorization
      description: |
        Anonymous. The CLI polls every `interval` seconds with its
        `device_code`. Returns `pending`, `slow_down`, `authorized`
        (with JWT), `expired`, or `denied`.
      operationId: cliAuthPoll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
      responses:
        '200':
          description: Poll outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliDevicePollResponse'
        '404':
          description: Unknown device_code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/cli/authorize:
    post:
      tags: [auth]
      summary: Authorize a CLI device by user_code
      description: |
        JWT-required. Called from the rokha.ai `/cli` page after the
        user has logged in. Binds the `user_code` to the caller's
        identity, mints a CLI-scoped 30-day JWT, and stores it for the
        CLI's next poll.
      operationId: cliAuthAuthorize
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
                  example: ABCD-1234
      responses:
        '200':
          description: Code bound to identity; CLI poll will now return JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliDeviceAuthorizeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown user_code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Code already authorized or denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Code expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # LLM proxy — federated Anthropic forwarding via the user's
  # Rokha account (BYO key wins; tenant key + rate-limit fallback).
  # ============================================================

  /api/v1/llm/proxy:
    post:
      tags: [llm]
      summary: Forward an Anthropic /v1/messages request through Rokha
      description: |
        JWT-required. Forwards an Anthropic-shaped messages request to
        Anthropic using the caller's BYO key (if present in
        `agent_api_keys`) or the Rokha tenant key as a rate-limited
        fallback. Only `claude-*` models are accepted; default is
        `claude-haiku-4-5-20251001`. Streaming is rejected in this
        slice (v0.3.2 will add it).

        Body and response mirror Anthropic's `/v1/messages` shape
        verbatim, so existing Anthropic SDKs can be pointed at this
        URL with no other changes (set the base to
        `https://erebus.rokha.ai/api/v1/llm` and send a Rokha JWT
        instead of `x-api-key`).
      operationId: llmProxy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        '200':
          description: Forwarded response from Anthropic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
        '400':
          description: Bad request (e.g. unsupported model or stream=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Tenant-key rate limit exceeded (free tier)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream Anthropic error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No tenant key configured AND caller has no BYO key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # Agents — Rokha chat + models + tools
  # ============================================================

  /api/agents/health:
    get:
      tags: [agents]
      summary: Agent service health
      operationId: agentsHealth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/agents/rokha-agent/chat:
    post:
      tags: [agents]
      summary: Chat with Rokha (authenticated)
      description: |
        Standard non-streaming chat. JWT is required for paid-tier features;
        without it, the request is treated as pre-login free-tier.
      operationId: agentChat
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'

  /api/agents/available:
    get:
      tags: [agents]
      summary: The agent picker — Rokha + every public sub-agent persona
      description: >-
        Rokha first (the default), then every sub-agent persona whose owner
        made it public — handle, name, bio, glyph, and (because a locked
        config is a promise about how the agent runs) `locked` +
        `locked_model` when the creator forces one. Feeds the Profile →
        AGENTS picker; an agent can use it the same way to discover chattable
        personas. A caller's own PRIVATE agents come from GET /api/pages/me,
        not from here. Public, no auth.
      operationId: agentsAvailable
      responses:
        '200':
          description: '{ agents: [{handle, name, bio, glyph, builtin, default, locked, locked_model}] }'
          content:
            application/json:
              schema: { type: object }

  /api/agents/{agent_name}/chat:
    post:
      tags: [agents]
      summary: Chat with a named agent — Rokha, or a sub-agent persona (JWT)
      description: |
        The generic chat door. `rokha-agent` chats with Rokha. Any other
        name is resolved as a SUB-AGENT PERSONA handle (Agent Creation B0):
        an account that toggled agent_mode via PUT /api/pages/me/agent. The
        persona answers in its own voice, built from that account's page +
        persona harnesses. A PUBLIC persona (agent_public, listed in GET
        /api/agents/available) is open to every logged-in caller; a private
        one answers only its owner (anyone else: 403 agent_private). The
        RUNNER pays for their own turns and can never write into the
        persona owner's memory. A LOCKED persona config forces its model:
        a runner whose tier can't run it gets a 400 naming the model —
        never a silent downgrade. A persona carries its OWNER's toolkit
        loadout (agent-toolkit prefs, optionally narrowed by
        agent_config.tool_profiles); tools execute with the CALLER's
        authority, and a visiting caller's turn keeps only READ-ONLY
        tools (nothing that writes, posts, or spends is reachable off
        owner-authored persona text with a runner's authority). Unknown
        names: 404 AGENT_NOT_SUPPORTED. Identity always comes from the
        verified bearer token; body-supplied identity fields are
        overwritten. The streaming twin is
        /api/agents/{agent_name}/chat/stream.
      operationId: namedAgentChat
      security:
        - bearerAuth: []
      parameters:
        - { name: agent_name, in: path, required: true, schema: { type: string }, description: "'rokha-agent', or a sub-agent persona's page handle" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: Chat response (persona turns answer as the persona)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
        '403': { description: agent_private — the persona is not yours (public invocation is not open yet) }
        '404': { description: AGENT_NOT_SUPPORTED — no such agent or persona }

  /api/agents/rokha-agent/chat/public:
    post:
      tags: [agents]
      summary: Chat with Rokha (no auth — pre-login)
      operationId: agentChatPublic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'

  /api/agents/rokha-agent/chat/stream:
    post:
      tags: [agents]
      summary: Streaming chat with Rokha (SSE)
      description: |
        Server-sent events. Event types: `content`, `thinking`, `tool_start`,
        `tool_result`, `done`. Current MVP buffers the full response and
        emits one `content` event followed by `done`; real per-token
        streaming is planned.
      operationId: agentChatStream
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Lines alternate `event: <type>` and `data: <json>`,
                  with blank lines as event separators.

  /api/agents/rokha-agent/chat/stream/public:
    post:
      tags: [agents]
      summary: Streaming chat (no auth)
      operationId: agentChatStreamPublic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }

