      description: "Signed in. `login_is_wallet` is true when the login itself is a Solana wallet (it counts without a link). Everything a proven wallet holds counts to the account that proved it — the $ROKHA holder door reads these."
      operationId: walletLinks
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  login_is_wallet: { type: boolean }
                  wallets:
                    type: array
                    items:
                      type: object
                      properties:
                        wallet: { type: string }
                        proven_at: { type: string, format: date-time }
        '401': { description: Sign in first }
  /api/ladder/wallet-link/challenge:
    post:
      tags: [wallets]
      summary: "Start linking a wallet to this account — the message to sign"
      description: |
        Signed in. Names a Solana wallet and gets back the exact text the
        wallet must sign (ed25519 over a server nonce — the same proof a wallet
        login is; a signature, never a transaction). One outstanding challenge
        per account, ten minutes. Refused: another account's login wallet
        (409 — sign in with it instead), this account's own login wallet (it
        counts already), a malformed address (400).
