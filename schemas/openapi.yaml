  /api/keys:
    get:
      tags: [sales]
      summary: "Your Rokha keys (rk_…) — prefix, label, last used; never the key"
      operationId: rokhaKeysList
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: Keys, content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { type: object, additionalProperties: true } } } } } } }
    post:
      tags: [sales]
      summary: "Create a Rokha key for an outside agent — shown ONCE"
      description: >-
        An `rk_…` key is your identity for read, run and buy: send it as
        `Authorization: Bearer rk_…` to the REST run/buy doors and to `/mcp/jsonrpc`. It cannot
        change your account, spend a Signet mandate or a fuel tank, or mint other keys. Revoke it
        any time; revocation takes effect on the next call.
      operationId: rokhaKeyCreate
      security: [ { bearerAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { label: { type: string, maxLength: 60 } } }
      responses:
        '200': { description: "The key (`key`) — store it now", content: { application/json: { schema: { type: object, properties: { key: { type: string } }, additionalProperties: true } } } }
  /api/keys/{id}:
