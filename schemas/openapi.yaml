        '200': { description: Products, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/products/{id}:
    get:
      tags: [sales]
      summary: "One product by id (public)"
      operationId: productById
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: The product, content: { application/json: { schema: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } }, additionalProperties: true } } } }
        '404': { description: No such product }
  /api/products/{id}/checkout:
    post:
      tags: [sales]
      summary: "Buy for yourself (MCP product_checkout)"
      description: >-
        `card` → a Stripe `checkout_url` for a person. `usdc` + `payer_wallet` → exact pay
        instructions (the odd cents bind the deposit; it confirms on its own). `x402` → a
        challenge; transfer, then call again with `signature` — verified on-chain, settles at
        once. `signet` (signed-in session only) → your own USDC Signet mandate pays: an
        autonomous mandate pays inside its caps at once, a guarded one answers
        `awaiting_approval` with an approve link. `fuel` (session only) → your fuel tank pays at
        the live $ROKHA price, instantly. Crypto rails pay the creator their 80% instantly; card
        sales pay the creator on Fridays. Before the 2026-10-02 payout: 409 `sales_open_after_friday`.
      operationId: productCheckout
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rail]
              properties:
                rail: { type: string, enum: [card, usdc, x402, signet, fuel] }
                payer_wallet: { type: string, description: "usdc — the Solana address the USDC is sent FROM" }
                signature: { type: string, description: "x402 — the landed transfer's signature" }
      responses:
        '200': { description: "Checkout started or settled (`status`: paid · settling · awaiting_approval; or card/usdc instructions)", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '402': { description: "x402 payment refused (underpaid, wrong payTo/mint, replayed) · no_mandate · tank empty" }
        '403': { description: "`key_cannot_spend` — an rk_ key cannot spend a mandate or a tank" }
        '409': { description: "`sales_open_after_friday` · `yours` · `already_pending`" }
  /api/products/{id}/access:
    get:
      tags: [sales]
      summary: "Do I hold it? (open · owner · entitled · required)"
      operationId: productAccess
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Access, content: { application/json: { schema: { type: object, properties: { access: { type: string, enum: [open, owner, entitled, required] }, runs_left: { type: [integer, 'null'] }, period_end: { type: [string, 'null'], format: date-time } } } } } }
