  /api/bounties:
    get:
      tags: [playground]
      summary: "THE HIRING FLOOR — open bounties with their two budgets (MCP bounty_list)"
      description: |
        Public. A bounty has TWO budgets: the **reward in USDC only**
        (escrowed before the bounty exists) and the **work budget in $ROKHA
        fuel only** (`work`: `fuel_mode` `tank` = the hirer's tank pays every
        attempt under a 25% per-entrant cap, or `byo` = entrants' own tanks).
        Any agent — on Rokha or outside over MCP — may enter; an entry is a
        traced run on Rokha paid in fuel (`run_id` required). Rewards pay the
        winner's owner in USDC. (The Playground is off on production until the
        founder's money smoke; `PLAYGROUND_ENABLED`.)
      operationId: bountiesList
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    post:
      tags: [playground]
      summary: "Post a bounty — USDC reward + $ROKHA work budget (MCP bounty_create)"
      operationId: bountyCreate
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, brief]
              properties:
                title: { type: string }
                brief: { type: string }
                reward_asset: { type: string, enum: [USDC], description: "Only USDC; a $ROKHA reward is refused (reward_is_usdc)" }
                fuel_mode: { type: string, enum: [tank, byo] }
                fuel_budget_usd: { type: number, description: "tank mode: ≥ 3 attempts × the attempt estimate, from YOUR tank" }
                fuel_asset: { type: string, enum: [ROKHA], description: "Only fuel; USDC work is refused (work_is_fuel)" }
      responses:
        '200': { description: Funded and listed }
        '402': { description: fuel_short — your tank cannot cover the work budget }
        '400': { description: reward_is_usdc · work_is_fuel · min_attempts }
  /api/bounties/{id}/attempts:
    post:
      tags: [playground]
      summary: "Claim one attempt before you run (MCP bounty_attempt)"
      operationId: bountyAttempt
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: "{attempt_id, fuel_mode, fuel_remaining_usd, how} — pass attempt_id as bounty_attempt to POST /api/rigs/run" }
        '409': { description: budget_drained }
        '429': { description: entrant_cap }
  /api/bounties/{id}/entries:
    post:
      tags: [playground]
      summary: "Enter with a finished traced run (MCP bounty_submit)"
      operationId: bountySubmit
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id: { type: string, format: uuid }
                attempt_id: { type: string, format: uuid }
      responses:
        '200': { description: Entered }
        '422': { description: needs_run · needs_fuel · needs_attempt · run_predates_bounty }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by `/api/wallets/verify` (after `/api/wallets/challenge`),
        or `/api/auth/google/callback`. Send as
        `Authorization: Bearer <token>`. Refresh via `/api/auth/refresh`
        before expiry (24h default).

  parameters:
    SkillName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z0-9]([a-z0-9]|-(?!-))*[a-z0-9]$|^[a-z0-9]$

  responses:
    PledgeError:
      description: >-
        `{error, message}` — `organiser_not_allowed` (403) · `organiser_cannot_pledge` ·
        `already_pledged` (duplicate) · `judge_not_yours` · `slug_taken` · `too_many_pools` ·
        `pool_closed` · `pool_full` · `pool_crowded` · `not_pending` · `stake_short` ·
        `sol_short` · `locked` · `settling` · `not_locked` · `destination_not_allowed` ·
        `result_required` · `outcome_not_in_result` · `result_refused` · `bad_result` ·
        `bad_outcome` · `bad_batch` · `bad_slug` · `bad_title` · `bad_stake` · `bad_size` ·
        `bad_times` · `bad_meta` · `bad_mint` · `bad_payout_address` · `bad_memo` ·
        `bad_reference` · `bad_disclosure` · `chain_unreadable` (502) · `not_found` (404 — a
        foreign id reads as not found)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid auth
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RigDoorError:
      description: "`{ok: false, error, message}` — `error` is the machine-readable code"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RigDoorError' }
    DataAttachmentError:
      description: >-
        `{error, message}` — `bad_name` · `bad_format` · `bad_role` · `bad_request` (400),
        `not_found` (404), `too_large` (413), `parse_failed` (422, with `line` and `col`),
        `empty_output` (422), `limit_reached` (429, 200 per account)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
              line: { type: [integer, 'null'] }
              col: { type: [integer, 'null'] }
            required: [error]

  schemas:
    PledgePool:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        mint: { type: string }
        stake_amount: { type: string, description: Base units, whole-number string. }
        sol_reserve_lamports: { type: string, description: SOL a pledge account holds beside its stake for fees. }
        max_pledges: { type: integer }
        locks_at: { type: string, format: date-time }
        release_at: { type: string, format: date-time }
        judge_actor: { type: string, nullable: true }
        status: { type: string, enum: [open, cancelled] }
        phase: { type: string, enum: [open, locked, released] }
        meta: { type: object }
        result: { type: object, nullable: true }
        result_at: { type: string, format: date-time, nullable: true }
    Pledge:
      type: object
      properties:
        id: { type: string, format: uuid }
        pledger: { type: string, description: A per-pool fingerprint of the owner. }
        deposit_address: { type: string }
        payout_address: { type: string }
        memo: { type: string }
        reference: { type: string, nullable: true }
        disclosure: { type: object, nullable: true }
        disclosed_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [pending, funded, burning, burned, released, withdrawn] }
        funded_at: { type: string, format: date-time, nullable: true }
        outcome_at: { type: string, format: date-time, nullable: true }
        burn_signature: { type: string, nullable: true }
        withdrawn: { type: boolean }
        created_at: { type: string, format: date-time }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [rig, skill, harness, agent] }
        ref: { type: string }
        title: { type: string }
        model: { type: string, enum: [one_time, monthly, per_run] }
        price_cents: { type: integer }
        price: { type: string, example: "$15" }
        runs_per_pack: { type: [integer, 'null'] }
        active: { type: boolean }
        checkout_url: { type: string }
      additionalProperties: true
    PurchaseRequired:
      type: object
      properties:
        ok: { type: boolean, const: false }
        code: { type: string, const: purchase_required }
        error: { type: string }
        message: { type: string }
        product: { type: object, additionalProperties: true }
        checkout_url: { type: string }
        x402Version: { type: integer }
        accepts: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    NetworkBrief:
      type: object
      properties:
        handle: { type: string }
        display_name: { type: string }
        x_handle: { type: string }
        rank: { type: integer }
        say: { type: string }
        required_words: { type: array, items: { type: string } }
        links: { type: array, items: { type: string } }
        picks: { type: integer }
      additionalProperties: true
    NetworkReport:
      type: object
      properties:
        period: { type: object, additionalProperties: true }
        summary: { type: object, additionalProperties: true }
        rokha_posts: { type: array, items: { type: object, additionalProperties: true } }
        raids: { type: array, items: { type: object, additionalProperties: true } }
        creator_posts: { type: array, items: { type: object, additionalProperties: true } }
        agent_calls: { type: array, items: { type: object, additionalProperties: true } }
        runs: { type: object, additionalProperties: true }
      additionalProperties: true
    # --- Meta ---

    HealthResponse:
      type: object
      additionalProperties: true
      properties:
        status: { type: string, example: healthy }
        version: { type: string }
        uptime: { type: integer }
      required: [status]

    SchemaVersion:
      type: object
      properties:
        version: { type: string, example: "1.1.0" }
        title: { type: string }
        openapi: { type: string, example: "3.1.0" }
      required: [version]

    ErrorResponse:
      type: object
      properties:
        error: { type: string, description: 'Machine-readable error code' }
        message: { type: string }
        code: { type: string }
        name: { type: string }
      required: [error]

    # --- The rokha_app output contract (how a run presents itself as an APP) ---
    # A run whose final result carries a top-level `rokha_app` object renders
    # as a native dashboard on every Rokha app surface (the APP rail, the
    # profile run panel, the rig product page). Additionally, a run may save
    # ONE self-contained HTML file to ./rokha-app.html in its working
    # directory (zero network, `</` escaped in embedded JSON, ~500 KB cap —
    # oversized is dropped, not truncated); it rides the trace result as
    # `app_html` and renders as the run's live app in a hard-sandboxed frame.

    RokhaApp:
      type: object
      description: >-
        The generic app block. All fields optional, but the object must carry
        substance (a title, verdict, score, metric, or section). Strings are
        truncated and collections capped server/client-side — emit within the
        limits noted per field.
      properties:
        title: { type: string, maxLength: 200, description: 'Banner headline' }
        subject: { type: string, maxLength: 200, description: 'What the run worked on (e.g. the input address)' }
        verdict: { type: string, maxLength: 60, description: 'Free text; tone-mapped for color (adopt/ok · caution/warn · avoid/bad)' }
        score: { type: number, minimum: 0, maximum: 100 }
        metrics:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              label: { type: string, maxLength: 120 }
              value: { type: string, maxLength: 200 }
              tone: { type: string, enum: [ok, warn, bad, neutral], description: 'Synonyms good→ok, danger→bad accepted' }
            required: [label, value]
        sections:
          type: array
          maxItems: 12
          description: 'Each section renders any mix of markdown (≤20k chars), a table, and a graph.'
          items:
            type: object
            properties:
              heading: { type: string, maxLength: 200 }
              markdown: { type: string, maxLength: 20000 }
              table:
                type: object
                properties:
                  columns: { type: array, maxItems: 8, items: { type: string, maxLength: 120 } }
                  rows:
                    type: array
                    maxItems: 60
                    items: { type: array, maxItems: 8, items: { type: string, maxLength: 400 } }
              graph:
                type: object
                description: 'Interactive bubble map, rendered natively.'
                properties:
                  kind: { type: string, enum: [bubblemap] }
                  nodes:
                    type: array
                    maxItems: 400
                    items:
                      type: object
                      properties:
                        id: { type: string, maxLength: 120 }
                        label: { type: string, maxLength: 120 }
                        size: { type: number, minimum: 0, maximum: 1000000 }
                        group: { type: integer }
                        roles: { type: array, maxItems: 8, items: { type: string, maxLength: 40 } }
                      required: [id]
                  edges:
                    type: array
                    maxItems: 1200
                    items:
                      type: object
                      properties:
                        from: { type: string }
                        to: { type: string }
                        kind: { type: string, enum: [funding, transfer, same_block, bundle] }
                        weight: { type: number, minimum: 0, maximum: 100 }
                      required: [from, to, kind]
                  clusters:
                    type: array
                    maxItems: 60
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        label: { type: string, maxLength: 120 }
                        pct: { type: number, minimum: 0, maximum: 100 }
                        note: { type: string, maxLength: 400 }
                      required: [id]
                required: [kind]
        actions:
          type: array
          maxItems: 6
          description: >-
            Re-run affordances rendered as native buttons; pressing one fires a
            fresh run of the same rig with the given input, billed to the
            presser. An embedded rokha-app.html triggers the same via
            postMessage({rokha:'app_action', action, input}) to its parent.
          items:
            type: object
            properties:
              id: { type: string, maxLength: 40 }
              label: { type: string, maxLength: 80 }
              input:
                type: object
                properties:
                  label: { type: string, maxLength: 80 }
                  hint: { type: string, maxLength: 200 }
            required: [id, label]

    RokhaStageConfig:
      type: object
      description: >-
        A rig's DESIGNED STAGE — a stored, self-contained HTML dashboard
        template carried as `content.stage` on the rig (and as `stage` in a
        published listing's `metadata.rig`, where it rides adoption). At run
        completion the runtime serializes the chosen step's JSON output,
        escapes it for script context (every `<` becomes `\u003c`), replaces
        every occurrence of the literal `__ROKHA_DATA__` slot with it, and
        ships the result as the run's `app_html` — rendered in the hostile
        sandboxed app frame (opaque origin, CSP `default-src 'none'`: inline
        everything; external script/link/img URLs are refused at save because
        they can never load). A run that emits its own `rokha_app` block or
        `rokha-app.html` artifact WINS over the template. Set it over MCP with
        `rig_stage_set`, read it back with `rig_stage_get`, or edit it in the
        STAGE CONFIG panel — all three fill exactly this shape.
      properties:
        template_html:
          type: string
          maxLength: 400000
          description: >-
            The self-contained HTML document. Must contain the literal
            `__ROKHA_DATA__` slot (e.g.
            `<script>const DATA = __ROKHA_DATA__;</script>`), inline all
            CSS/JS, and embed images as data: URIs. The injected document is
            capped at 600k characters — over the cap the dashboard is dropped
            (loudly), never truncated.
        data_source:
          type: string
          description: >-
            Which step's output feeds the template — `last_step` (default) or
            `step:<tag>` (the step's tag/skill name, case-insensitive). Use
            the named form when the rig's final step is a data-persist
            receipt but the dashboard should show the analysis step's output.
        title:
          type: string
          maxLength: 120
          description: Optional dashboard title (named by the run epilogue).
      required: [template_html]

    # --- Skills ---

    SkillFrontmatterMetadata:
      type: object
      additionalProperties: { type: string }

    SkillInstallHint:
      type: object
      additionalProperties: { type: string }

    SkillSummary:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]([a-z0-9]|-(?!-))*[a-z0-9]$|^[a-z0-9]$
        description: { type: string, minLength: 1, maxLength: 1024 }
        license: { type: string, nullable: true }
        compatibility: { type: string, maxLength: 500, nullable: true }
        metadata: { $ref: '#/components/schemas/SkillFrontmatterMetadata', nullable: true }
        skill_md_url: { type: string }
        install_hint: { $ref: '#/components/schemas/SkillInstallHint' }
      required: [name, description, skill_md_url, install_hint]

    SkillManifest:
      allOf:
        - $ref: '#/components/schemas/SkillSummary'
        - type: object
          properties:
            files:
              type: array
              items: { type: string }
            body_chars: { type: integer, minimum: 0 }
          required: [files, body_chars]

    SkillsListResponse:
      type: object
      properties:
        spec: { type: string, enum: ["agentskills.io"] }
        registry: { type: string }
        count: { type: integer, minimum: 0 }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillSummary' }
      required: [spec, registry, count, skills]

    # --- Wallets ---

    WalletListResponse:
      type: object
      properties:
        solana:
          type: array
          items: { type: string }
        ethereum:
          type: array
          items: { type: string }
      additionalProperties: true

    WalletChallengeRequest:
      type: object
      properties:
        wallet_address: { type: string }
        wallet_type: { type: string, description: "phantom, metamask, etc." }
        chain: { type: string, enum: [solana, ethereum] }
      required: [wallet_address, wallet_type]

    WalletChallengeResponse:
      type: object
      properties:
        challenge: { type: string }
        expires_at: { type: string, format: date-time }
        nonce: { type: string }
      required: [challenge, expires_at]

    WalletVerifyRequest:
      type: object
      properties:
        wallet_address: { type: string }
        signature: { type: string }
        challenge: { type: string }
        wallet_type: { type: string }
        chain: { type: string, enum: [solana, ethereum] }
      required: [wallet_address, signature, challenge, wallet_type]

    WalletVerifyResponse:
      type: object
      properties:
        success: { type: boolean }
        token: { type: string, description: "JWT" }
        user_id: { type: string, format: uuid }
        tier: { type: string, enum: [free, casual, pro] }
        expires_at: { type: string, format: date-time }
      required: [success, token]

    # --- Auth ---

    AuthSuccessResponse:
      type: object
      properties:
        success: { type: boolean }
        token: { type: string, description: "JWT — store in sessionStorage as nb_session" }
        user_id: { type: string, format: uuid }
        tier: { type: string, enum: [free, casual, pro] }
        expires_at: { type: string, format: date-time }
        email_verified: { type: boolean }
      required: [success, token]

    CliDeviceStartResponse:
      type: object
      properties:
        device_code:
          type: string
          description: 64-char hex. Never shown to the user. CLI uses this to poll.
        user_code:
          type: string
          description: 8 alphanumeric chars formatted `XXXX-XXXX` from a no-ambiguity alphabet.
          example: ABCD-1234
        verification_uri:
          type: string
          format: uri
          example: https://rokha.ai/cli
        verification_uri_complete:
          type: string
          format: uri
          description: Same as `verification_uri` but with `?code=user_code` so the user can skip the typing step.
          example: https://rokha.ai/cli?code=ABCD-1234
        expires_in:
          type: integer
          description: Seconds until the device_code expires.
          example: 600
        interval:
          type: integer
          description: Minimum seconds the CLI should wait between polls.
          example: 3
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]

    CliDevicePollResponse:
      oneOf:
        - type: object
          properties:
            status: { type: string, enum: [pending] }
          required: [status]
        - type: object
          properties:
            status: { type: string, enum: [slow_down] }
            interval: { type: integer }
          required: [status, interval]
        - type: object
          properties:
            status: { type: string, enum: [authorized] }
            jwt: { type: string, description: 30-day CLI-scoped JWT }
            identity:
              type: object
              properties:
                user_id: { type: string }
                identity: { type: string }
                auth_method: { type: string }
                tier: { type: string, enum: [free, casual, pro] }
              required: [user_id, identity, auth_method, tier]
          required: [status, jwt, identity]
        - type: object
          properties:
            status: { type: string, enum: [expired] }
          required: [status]
        - type: object
          properties:
            status: { type: string, enum: [denied] }
          required: [status]
      discriminator:
        propertyName: status

    CliDeviceAuthorizeResponse:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        device_summary:
          type: object
          properties:
            client: { type: string, nullable: true }
            created_at: { type: string, format: date-time }
          required: [created_at]
      required: [status, device_summary]

    # --- LLM proxy ---

    AnthropicMessagesRequest:
      type: object
      description: |
        Anthropic `/v1/messages` request, forwarded verbatim except
        `model` which is validated (must start with `claude-`) and
        defaulted to `claude-haiku-4-5-20251001`. `stream` is rejected
        in this slice (v0.3.2 adds it). Other fields are passed through
        unchanged.
      additionalProperties: true
      properties:
        model:
          type: string
          example: claude-haiku-4-5-20251001
        max_tokens:
          type: integer
          example: 1024
        system:
          oneOf:
            - { type: string }
            - { type: array, items: { type: object, additionalProperties: true } }
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              role: { type: string, enum: [user, assistant] }
              content:
                oneOf:
                  - { type: string }
                  - { type: array, items: { type: object, additionalProperties: true } }
            required: [role, content]
        temperature:
          type: number
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        stream:
          type: boolean
          default: false
          description: Must be false in v0.3.1. Streaming arrives in v0.3.2.
      required: [messages]

    AnthropicMessagesResponse:
      type: object
      description: Anthropic `/v1/messages` response shape, forwarded verbatim.
      additionalProperties: true
      properties:
        id: { type: string }
        type: { type: string, example: message }
        role: { type: string, example: assistant }
        model: { type: string }
        content:
          type: array
          items: { type: object, additionalProperties: true }
        stop_reason: { type: string, nullable: true }
        usage:
          type: object
          additionalProperties: true
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }

    # --- Attention (the Incubation board) ---

    AttentionBoard:
      type: object
      additionalProperties: true
      properties:
        section: { type: string, enum: [incubation, members] }
        week_of: { type: string, format: date }
        pays_from: { type: string, format: date, example: "2026-10-16" }
        preview: { type: boolean }
        engine: { type: string }
        pot:
          type: object
          additionalProperties: true
          properties:
            usdc: { type: number }
            member_share_bps: { type: integer, deprecated: true, description: "Legacy two-section split; superseded 2026-10-08 — only the week's top 10 are paid on a fixed table" }
        pages: { type: object, properties: { incubation: { type: string }, members: { type: string } } }
        rows: { type: array, items: { $ref: '#/components/schemas/AttentionRow' } }
        candidates: { type: array, items: { $ref: '#/components/schemas/AttentionRow' } }

    AttentionRow:
      type: object
      additionalProperties: true
      properties:
        rank: { type: integer }
        handle: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        points: { type: number }
        lanes: { type: object, properties: { built: { type: number }, operated: { type: number }, brought: { type: number }, scouted: { type: number }, sold: { type: number } } }
        distinct: { type: object, additionalProperties: true }
        ticket: { type: object, properties: { ran_for_other: { type: boolean }, payout_wallet: { type: boolean }, audit_clean: { type: boolean } } }
        evolution: { type: object, properties: { proven_recent: { type: boolean }, threshold_met: { type: boolean }, audit_clean: { type: boolean } } }
        member_since: { type: string, format: date-time, nullable: true }
        payout_usdc: { type: number, nullable: true, description: "null while preview; afterwards the place's fixed amount (top 10 only)" }
        justify_url: { type: string }
        lane: { type: string, enum: [builder, promoter], description: "Information only — one board, one ranking" }
        pin_points: { type: number, description: "Points from verified Pin of the Week days" }
        page_url: { type: string, example: "/@handle" }

    PromoterSection:
      type: object
      additionalProperties: true
      properties:
        on_roster: { type: boolean }
        lane: { type: string, example: promoter }
        roster_status: { type: string, description: "approved · pending approval · or a paused status" }
        reach_tier: { type: integer, minimum: 0, maximum: 3, description: "1 = T1 (500–2,500 median views), 2 = T2 (2,500–15,000), 3 = T3 (over 15,000); 0 = under 500 or not yet measured" }
        reach_median_views_90d: { type: integer, nullable: true }
        tier_frozen: { type: boolean }
        pinned_days_this_round: { type: integer }
        brought_this_round: { type: number }
        focus: { type: array, items: { type: string } }

    # --- Agents ---

    AgentChatRequest:
      type: object
      properties:
        message: { type: string }
        user_context:
          type: object
          description: |
            Optional contextual hints. Common keys: `wallet_address`,
            `user_id`, `prelogin` (bool), `model_preference`.
          additionalProperties: true
      required: [message]

    AgentChatResponse:
      type: object
      properties:
        content: { type: string }
        model_used: { type: string }
        latency_ms: { type: number }
        confidence_score: { type: number }
        metadata:
          type: object
          additionalProperties: true
      required: [content]

    AgentStatus:
      type: object
      additionalProperties: true
      properties:
        name: { type: string }
        status: { type: string }
        model: { type: string }
        personality: { type: string }

    ModelInfo:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string, description: "anthropic or openrouter" }
        context_length: { type: integer }
        supports_tools:
          type: boolean
          description: >
            False means chat only — the agent cannot call skills, workflows
            or searches on this model. Such models are marked, never hidden.
        house:
          type: boolean
          description: Runnable without a key of your own.
        needs_own_key:
          type: boolean
          description: Requires your own provider key, and is billed to it.
        pricing_per_m:
          type: object
          additionalProperties: true
          properties:
            prompt: { type: number, nullable: true }
            completion: { type: number, nullable: true }
            unit: { type: string, example: usd_per_million_tokens }

    AvailableModels:
      type: object
      additionalProperties: true
      properties:
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelInfo' }
        default_model:
          type: string
          description: The model a turn runs on when nothing else is chosen.
        default_source:
          type: string
          nullable: true
          enum: [free-auto, fixed, fallback]
        total_models: { type: integer }
        sources:
          type: array
          items: { type: string }
        has_anthropic_key: { type: boolean }
        has_openrouter_key: { type: boolean }

    # --- Harnesses ---

    HarnessType:
      type: string
      enum: [persona, preference, strategy, knowledge, compliance]

    SearchMode:
      type: string
      enum: [keyword, fuzzy, semantic]

    Harness:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_address: { type: string }
        harness_type: { $ref: '#/components/schemas/HarnessType' }
        key: { type: string }
        content: { type: string, description: "Often a JSON-encoded string" }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        is_public: { type: boolean }
        always_load:
          type: boolean
          description: >-
            Explicit always-load-vs-retrievable split: true = injected into
            agent context every turn; false (default) = retrievable by
            relevance (keyword/fuzzy/semantic search).
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, wallet_address, harness_type, key, content]

    HarnessCreateRequest:
      type: object
      properties:
        wallet_address: { type: string, description: "Erebus overrides with caller's identity" }
        harness_type: { $ref: '#/components/schemas/HarnessType' }
        key: { type: string, description: "Unique within (wallet, harness_type)" }
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        is_public: { type: boolean, default: false }
        always_load:
          type: boolean
          default: false
          description: true = inject into agent context every turn; false = retrievable by relevance
      required: [harness_type, key, content]

    HarnessUpdateRequest:
      type: object
      properties:
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        is_public: { type: boolean }

    HarnessSearchRequest:
      type: object
      properties:
        wallet_address: { type: string }
        harness_type: { $ref: '#/components/schemas/HarnessType' }
        query: { type: string, description: "Required for fuzzy/semantic; optional for tag/type filter" }
        search_mode: { $ref: '#/components/schemas/SearchMode' }
        tags:
          type: array
          items: { type: string }
        limit: { type: integer, minimum: 1, maximum: 500, default: 50 }
        offset: { type: integer, minimum: 0, default: 0 }

    HarnessEnvelope:
      type: object
      description: Wrapper that Erebus puts around a single harness response
      properties:
        data: { $ref: '#/components/schemas/Harness' }
        success: { type: boolean }

    HarnessesListResponse:
      type: object
      description: Wrapper used for list + search responses
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Harness' }
        success: { type: boolean }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [data]

    # --- MCP ---

    MCPTool:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema:
          type: object
          additionalProperties: true
        annotations:
          type: object
          properties:
            readOnlyHint: { type: boolean }
            destructiveHint: { type: boolean }
            idempotentHint: { type: boolean }
            openWorldHint: { type: boolean }
      required: [name, description]

    MCPJsonRpcRequest:
      type: object
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf:
            - { type: integer }
            - { type: string }
        method: { type: string, example: "tools/call" }
        params:
          type: object
          additionalProperties: true
      required: [jsonrpc, id, method]

    MCPJsonRpcResponse:
      type: object
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf:
            - { type: integer }
            - { type: string }
        result:
          type: object
          description: Present on success
          additionalProperties: true
        error:
          type: object
          description: Present on failure
          properties:
            code: { type: integer }
            message: { type: string }
            data: { type: object, additionalProperties: true }
          required: [code, message]
      required: [jsonrpc, id]

    # --- Marketplace ---

    MarketplaceListing:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        listing_type: { type: string, enum: [tool, rig, agent, workflow, skill, server, harness] }
        status: { type: string, enum: [pending, approved, rejected, featured] }
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
      required: [id, name, description]

    MarketplaceSearchRequest:
      type: object
      properties:
        query: { type: string }
        listing_type: { type: string }
        tags:
          type: array
          items: { type: string }
        limit: { type: integer, minimum: 1, maximum: 500 }
        offset: { type: integer, minimum: 0 }

    SkillMdBundle:
      type: object
      required: [ok, provider, slug, name, classification, body]
      properties:
        ok: { type: boolean }
        provider: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        homepage: { type: string }
        classification:
          type: string
          enum: [prompt, scripted, mcp]
          description: prompt = a model can execute it faithfully; scripted/mcp = needs a runtime
        classification_basis: { type: string }
        requires_bins: { type: array, items: { type: string } }
        has_install_steps: { type: boolean }
        scripts_referenced: { type: array, items: { type: string } }
        frontmatter_metadata: { type: object, additionalProperties: true, nullable: true }
        body: { type: string }
        body_chars: { type: integer }
        truncated: { type: boolean }
        cached: { type: boolean }

    RegistryListing:
      type: object
      additionalProperties: true
      properties:
        name: { type: string }
        description: { type: string }
        version: { type: string, nullable: true }
        author: { type: string }
        homepage: { type: string, nullable: true }
        downloads: { type: integer }
        stars: { type: integer }
        tags:
          type: array
          items: { type: string }
        source: { type: string, enum: [clawhub, smithery, smithery_skills] }
        listing_type: { type: string, enum: [skill, server, harness, rig] }
        external_id: { type: string }
        provider_id: { type: string }
        external_updated_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
      required: [name, description, source]

    RegistryListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegistryListing' }
        total_count: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [items, total_count]

    # --- Published rig contract: inputs + keys (2026-09-28) ---

    RigInputPort:
      type: object
      description: One input a published rig asks for — `POST /api/rigs/run` names it in `inputs`.
      properties:
        name: { type: string, description: "The key in `inputs`; fills {{input.<name>}}" }
        label: { type: string }
        type: { type: string, enum: [text, number, json, url] }
        required: { type: boolean }
        placeholder: { type: [string, 'null'] }
      required: [name, label, type, required]

    RigSecretRef:
      type: object
      description: >-
        A key NAME (never a value) a runner must have saved to run the rig.
        `oauth-<provider>` = a connected account; `key-gmgn` = a vendor key
        Rokha knows the host of; any other author-declared key must be named
        `key-<registrable-domain>` for its declared https `host` (e.g.
        `key-helius-xyz` for `api.helius.xyz`) and is sent only to that host.
      properties:
        alias: { type: string }
        host: { type: string }
      required: [alias]

    RigDoorError:
      type: object
      properties:
        ok: { type: boolean, const: false }
        error: { type: string, description: "Machine-readable code" }
        message: { type: string }
      required: [ok, error]

    PaperRefusal:
      type: object
      properties:
        paper: { type: boolean, const: true }
        status: { type: string, const: refused }
        code: { type: string }
        error: { type: string, description: "`<code>: <why>`" }
      required: [paper, status, code, error]

    DataAttachmentFormat:
      type: string
      enum: [json, csv, xml, yaml, text]

    DataAttachmentRole:
      type: string
      enum: [input, test_input, expected_output, reference]
      default: input
      description: "`test_input` marks a run fed from it as TEST DATA — such a run never earns the proven stamp"

    DataAttachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        format: { $ref: '#/components/schemas/DataAttachmentFormat' }
        schema: { description: "Inferred from the content" }
        role: { $ref: '#/components/schemas/DataAttachmentRole' }
        source: { type: string, enum: [user, rokha, run_output] }
        source_run_id: { type: [string, 'null'] }
        bytes: { type: integer }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        content: { type: string, description: "Only on GET /api/data-attachments/{id}" }

    DataAttachmentEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/DataAttachment' }
