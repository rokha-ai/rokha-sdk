          application/json:
            schema:
              type: object
              required: [wallet]
              properties:
                wallet: { type: string }
      responses:
        '200': { description: "`ok` true when a link of yours was removed", content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
