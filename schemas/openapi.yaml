        - { name: agent_id, in: query, schema: { type: string, format: uuid }, description: One of your agents }
      responses:
        '200': { description: Report — rokha_posts, raids, creator_posts, agent_calls, runs with reach, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkReport' } } } }
  /api/network/members:
